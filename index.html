<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lureal">
<title>Lureal</title>
<style>
  :root{
    --void-0:#05060d; --void-1:#080b1a; --void-2:#0c1030;
    --ink:#e4ecff; --ink-soft:rgba(210,222,255,.62); --ink-faint:rgba(180,196,240,.34);
    --line:rgba(150,178,255,.16); --glow:#cfe0ff; --gold:#f2c94c;
    --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",-apple-system,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{color:var(--ink);font-family:var(--mincho);overflow:hidden;position:fixed;inset:0;
    -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:none;
    background:radial-gradient(120% 85% at 50% 52%, #ffffff 0%, #f5f7fc 68%, #eef1f8 100%);
    background-attachment:fixed;}
  body.dark{background:
      radial-gradient(120% 85% at 50% 56%, #04050c 0%, #070b1e 55%, #0b1236 100%),
      radial-gradient(100% 70% at 50% -8%, #101a44 0%, transparent 55%),
      linear-gradient(180deg, var(--void-1) 0%, var(--void-0) 100%);}
  #gl,#fx{position:fixed;inset:0;width:100%;height:100%;display:block;}
  #gl{z-index:0;pointer-events:none;}
  #fx{z-index:1;pointer-events:auto;}

  #whisper{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 7vh);
    text-align:center;z-index:3;pointer-events:none;font-size:14px;letter-spacing:.28em;
    color:var(--ink-faint);transition:opacity 1.1s ease;opacity:0;
    text-shadow:0 0 18px rgba(150,185,255,.4);}
  #whisper.on{opacity:1;}
  #flash{position:fixed;inset:0;z-index:5;background:#ffffff;opacity:0;pointer-events:none;}
  #ending{position:fixed;left:0;right:0;top:44%;transform:translateY(-50%);text-align:center;
    z-index:6;pointer-events:none;}
  #ending.on{pointer-events:auto;}
  #ending-main{font-size:16px;letter-spacing:.3em;color:#161a2e;opacity:0;transition:opacity 3s ease;}
  #ending-sub{margin-top:26px;font-family:var(--sans);font-size:11px;letter-spacing:.24em;
    color:rgba(22,26,46,.5);opacity:0;transition:opacity 3s ease;}

  .veil{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:calc(env(safe-area-inset-top) + 30px) 26px calc(env(safe-area-inset-bottom) + 48px);
    transition:opacity .8s ease;
    --ink:#1b1f2e; --ink-soft:rgba(27,31,46,.64); --ink-faint:rgba(27,31,46,.36);
    --line:rgba(40,58,120,.20); --glow:#3a5bd0; --void-0:#ffffff;
    color:var(--ink);
    background:radial-gradient(120% 85% at 50% 42%, #ffffff 0%, #f6f8fd 66%, #eef1f8 100%);}
  .veil.hide{opacity:0;pointer-events:none;}
  .wordmark{font-size:15px;letter-spacing:.5em;color:var(--glow);text-shadow:0 0 20px rgba(160,195,255,.5);}
  .wordmark .en{display:block;font-family:var(--sans);font-size:9px;letter-spacing:.42em;
    color:var(--ink-faint);margin-top:8px;font-weight:300;text-shadow:none;}
  .step{width:100%;max-width:400px;margin-top:32px;display:none;flex-direction:column;align-items:center;}
  .step.on{display:flex;}
  .ask{font-size:14px;letter-spacing:.2em;color:var(--ink-soft);margin-bottom:18px;text-align:center;line-height:1.9;}

  .seg{display:flex;margin-bottom:20px;border:1px solid var(--line);border-radius:999px;overflow:hidden;}
  .seg button{font-family:var(--sans);font-size:12px;letter-spacing:.12em;color:var(--ink-soft);
    background:transparent;border:none;padding:11px 22px;cursor:pointer;transition:.2s;}
  .seg button.on{background:var(--glow);color:var(--void-0);}

  .picker{display:none;flex-direction:column;align-items:center;width:100%;}
  .picker.on{display:flex;}
  .swatches{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 12px;margin-bottom:18px;max-width:320px;}
  .swatches button{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;
    cursor:pointer;font-family:var(--mincho);font-size:9.5px;color:var(--ink-soft);letter-spacing:.04em;width:44px;}
  .swatches .dot{width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.14);transition:.15s;}
  .swatches button.on .dot{box-shadow:0 0 0 2px var(--void-0),0 0 0 3px var(--glow),0 0 14px 2px rgba(160,195,255,.5);}
  .sliders{width:100%;max-width:320px;display:flex;flex-direction:column;gap:15px;margin-bottom:16px;}
  .sliders label{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:12px;
    font-family:var(--sans);font-size:11px;letter-spacing:.08em;color:var(--ink-soft);}
  .sliders input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;outline:none;margin:0;}
  .sliders input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
    background:#f2f6ff;border:1px solid rgba(0,0,0,.3);box-shadow:0 0 8px rgba(160,195,255,.6);cursor:pointer;}
  .sliders input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#f2f6ff;
    border:1px solid rgba(0,0,0,.3);cursor:pointer;}
  #hex{font-family:var(--mincho);font-size:15px;color:var(--ink);background:transparent;
    border:none;border-bottom:1px solid var(--line);padding:9px 4px;width:220px;text-align:center;letter-spacing:.04em;}
  #hex::placeholder{color:var(--ink-faint);font-size:12px;}
  .preview-row{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px 0 18px;}
  .preview{width:48px;height:48px;border-radius:50%;transition:background .3s,box-shadow .3s;}
  .preview-hex{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-faint);letter-spacing:.08em;}

  .birth{display:none;flex-direction:column;align-items:center;width:100%;}
  .birth.on{display:flex;}
  .bstep{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:10px;}
  .bstep .lbl{font-size:13px;color:var(--ink-soft);letter-spacing:.1em;width:22px;text-align:center;}
  .bstep b{font-family:var(--mincho);font-size:30px;min-width:52px;text-align:center;font-weight:400;color:var(--glow);}
  .bstep button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:transparent;
    color:var(--ink);font-size:20px;cursor:pointer;line-height:1;}
  .bstep button:active{background:var(--glow);color:var(--void-0);}

  #mantra{width:100%;min-height:120px;background:rgba(140,160,230,.05);border:1px solid var(--line);border-radius:14px;
    color:var(--ink);font-family:var(--mincho);font-size:16px;line-height:2;padding:16px;resize:none;letter-spacing:.04em;}
  #mantra::placeholder{color:var(--ink-faint);}
  .hint{font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;color:var(--ink-faint);
    margin-top:14px;line-height:1.9;text-align:center;}

  .counter{display:flex;align-items:center;gap:26px;margin-bottom:8px;}
  .counter button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:transparent;
    color:var(--ink);font-size:22px;font-family:var(--mincho);cursor:pointer;line-height:1;transition:.15s;}
  .counter button:active{background:var(--glow);color:var(--void-0);}
  .counter .n{font-size:40px;letter-spacing:.04em;min-width:64px;text-align:center;color:var(--glow);}
  .counter .n small{font-size:14px;color:var(--ink-faint);margin-left:4px;}

  .go{margin-top:36px;font-family:var(--mincho);font-size:15px;letter-spacing:.34em;color:var(--glow);
    background:transparent;border:1px solid var(--glow);border-radius:999px;padding:15px 44px;cursor:pointer;transition:.2s;
    box-shadow:0 0 20px rgba(160,195,255,.18);}
  .go:active{background:var(--glow);color:var(--void-0);}
  .back{margin-top:18px;font-family:var(--sans);font-size:11px;letter-spacing:.2em;color:var(--ink-faint);
    background:transparent;border:none;cursor:pointer;padding:8px;}
  /* ホーム／ひな型チップ／保存 */
  .prayer-list{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .prayer{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;
    background:rgba(140,160,230,.05);cursor:pointer;transition:.15s;}
  .prayer:active{background:rgba(140,160,230,.14);}
  .prayer .pd{width:20px;height:20px;border-radius:50%;flex:0 0 auto;}
  .prayer .pn{flex:1;text-align:left;font-size:15px;letter-spacing:.05em;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .prayer .px{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:none;background:transparent;
    color:var(--ink-faint);font-size:17px;cursor:pointer;line-height:1;}
  .prayer .px:active{color:var(--ink);}
  .empty-note{font-family:var(--sans);font-size:12px;color:var(--ink-faint);letter-spacing:.1em;margin:18px 0 4px;text-align:center;}
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:14px;}
  .chips button{font-family:var(--mincho);font-size:12.5px;letter-spacing:.08em;color:var(--ink-soft);
    background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 15px;cursor:pointer;transition:.15s;}
  .chips button:active{background:var(--glow);color:var(--void-0);}
  .save-row{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:340px;margin-top:24px;
    padding-top:20px;border-top:1px solid var(--line);}
  .save-toggle{display:flex;align-items:center;gap:11px;font-family:var(--sans);font-size:12.5px;letter-spacing:.08em;
    color:var(--ink-soft);cursor:pointer;}
  .save-toggle .box{width:20px;height:20px;border-radius:5px;border:1px solid var(--line);display:flex;align-items:center;
    justify-content:center;font-size:13px;color:var(--void-0);line-height:1;}
  .save-toggle.on .box{background:var(--glow);}
  #save-name{font-family:var(--mincho);font-size:15px;color:var(--ink);background:transparent;border:none;
    border-bottom:1px solid var(--line);padding:8px 4px;width:240px;text-align:center;letter-spacing:.04em;display:none;}
  #save-name.on{display:block;}
  #save-name::placeholder{color:var(--ink-faint);}
  /* 白背景モード（誘導・のちに設定も） */
  #induct{position:fixed;inset:0;z-index:7;display:none;}
  #induct.on{display:block;}
  #induct-text{position:fixed;left:0;right:0;top:21%;text-align:center;padding:0 34px;
    font-family:var(--mincho);font-size:20px;letter-spacing:.16em;line-height:2;color:#161a2e;
    opacity:0;transition:opacity .6s ease;}
  #induct-text.count{font-size:46px;letter-spacing:.32em;}
  #induct-text.mei{font-size:23px;letter-spacing:.26em;color:#2a3352;}
  #induct-text.final{top:52%;transform:translateY(calc(-50% - 3em));}
  #induct-skip{position:fixed;left:0;right:0;bottom:11%;text-align:center;
    font-family:var(--sans);font-size:12px;letter-spacing:.26em;color:rgba(22,26,46,.42);cursor:pointer;}
  .induct-seg{margin-top:18px;}
  #nightfall{position:fixed;inset:0;z-index:0;opacity:0;pointer-events:none;
    background:
      radial-gradient(120% 85% at 50% 56%, #04050c 0%, #070b1e 55%, #0b1236 100%),
      linear-gradient(180deg,#080b1a,#05060d);}
  #gate{position:fixed;inset:0;z-index:8;display:none;}
  #gate.on{display:block;}
  #gate-quote{position:fixed;left:0;right:0;top:21%;padding:0 34px;text-align:center;
    font-family:var(--mincho);font-size:19px;line-height:2.1;letter-spacing:.09em;color:#eef3ff;
    opacity:0;transition:opacity 1.6s ease;text-shadow:0 0 22px rgba(150,185,255,.28);}
  #gate-src{position:fixed;left:0;right:0;top:69%;text-align:center;font-family:var(--sans);
    font-size:11px;letter-spacing:.2em;color:rgba(210,222,255,.42);opacity:0;transition:opacity 1.6s ease;}
  #gate-go{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 12%);text-align:center;
    font-family:var(--mincho);font-size:14px;letter-spacing:.36em;color:#cfe0ff;opacity:0;
    transition:opacity 1.6s ease;cursor:pointer;}
</style>
</head>
<body>
<div id="nightfall"></div>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<div id="gate"><div id="gate-quote"></div><div id="gate-src"></div><div id="gate-go">祈りへ</div></div>
<div id="whisper"></div>
<div id="flash"></div>
<div id="induct">
  <div id="induct-text"></div>
  <div id="induct-skip">スキップ</div>
</div>
<div id="ending"><div id="ending-main"></div><div id="ending-sub"></div></div>

<div class="veil" id="veil">
  <div class="wordmark">Lureal<span class="en">ルリアル</span></div>

  <div class="step" id="step-home">
    <div class="ask">灯した祈り。</div>
    <div class="prayer-list" id="prayer-list"></div>
    <button class="go" id="new-prayer">＋ 新しい祈り</button>
  </div>

  <div class="step" id="step-color">
    <div class="ask">あなたに、応える色。</div>
    <div class="seg">
      <button data-mode="pick" class="on">選ぶ</button>
      <button data-mode="birth">誕生日で</button>
    </div>

    <div class="preview-row">
      <div class="preview" id="cprev"></div>
      <div class="preview-hex" id="cprev-hex">#E6863A</div>
    </div>

    <div class="picker on" id="picker-wrap">
      <div class="swatches" id="swatches"></div>
      <div class="sliders">
        <label>色あい<input type="range" id="sH" min="0" max="360" value="30"></label>
        <label>あざやかさ<input type="range" id="sS" min="20" max="100" value="80"></label>
        <label>あかるさ<input type="range" id="sL" min="25" max="75" value="55"></label>
      </div>
      <input type="text" id="hex" spellcheck="false" placeholder="#コード や gold・indigo も（任意）">
    </div>

    <div class="birth" id="birth-wrap">
      <div class="bstep"><span class="lbl">月</span>
        <button data-b="m" data-d="-1">−</button><b id="bMonth">1</b><button data-b="m" data-d="1">＋</button></div>
      <div class="bstep"><span class="lbl">日</span>
        <button data-b="d" data-d="-1">−</button><b id="bDay">1</b><button data-b="d" data-d="1">＋</button></div>
      <div class="hint">生まれた月日から、ひとつの色を導きます</div>
    </div>

    <button class="go" id="color-next">この色に</button>
  </div>

  <div class="step" id="step-word">
    <div class="ask">炎に、食べさせる言葉。</div>
    <textarea id="mantra" placeholder="マントラ、祈り、自分で決めた一言。&#10;空のままでも、息だけを灯せます。"></textarea>
    <div class="chips" id="word-chips"></div>
    <div class="hint">ひと息で、この言葉をひとめぐり吸い込みます。ひな型はタップで入る（もう一度で次の候補）</div>
    <button class="go" id="word-next">つぎへ</button>
    <button class="back" id="word-back">← 色へ戻る</button>
  </div>

  <div class="step" id="step-closing">
    <div class="ask">結びの、ひとこと。</div>
    <textarea id="closing" placeholder="満ちたときに現れる言葉。&#10;空なら「祈りは、光になった」。"></textarea>
    <div class="chips" id="closing-chips"></div>
    <div class="hint">祈りが満ちた瞬間、白の中へ現れます</div>
    <button class="go" id="closing-next">つぎへ</button>
    <button class="back" id="closing-back">← 言葉へ戻る</button>
  </div>

  <div class="step" id="step-count">
    <div class="ask">いくつの息を、捧げる。</div>
    <div class="counter">
      <button id="minus">−</button>
      <div class="n"><span id="count-n">3</span><small>息</small></div>
      <button id="plus">＋</button>
    </div>
    <div class="hint">数は表に出ません。球の育ちが、あなたの数です</div>

    <div class="seg induct-seg" id="tempo-seg">
      <button data-t="0">ゆっくり</button>
      <button data-t="1" class="on">ふつう</button>
      <button data-t="2">はやい</button>
    </div>
    <div class="hint">誘導の速さ</div>

    <div class="save-row">
      <div class="save-toggle" id="save-toggle"><span class="box" id="save-box"></span>この祈りを覚えておく</div>
      <input type="text" id="save-name" spellcheck="false" placeholder="祈りの名前">
    </div>

    <button class="go" id="begin">灯す</button>
    <button class="back" id="count-back">← 結びへ戻る</button>
  </div>
</div>

<script>
/* ============================================================
   ともしび / EMBER  ── 闇に灯す、その場限りの光
   色は燃料、言葉は糧、粒は幸運（青白＋金）。記録しない。
   ============================================================ */
const DPR=Math.min(window.devicePixelRatio||1,2);
const glc=document.getElementById("gl"), fxc=document.getElementById("fx");
const fx=fxc.getContext("2d");
const flashEl=document.getElementById("flash");
const nightfallEl=document.getElementById("nightfall");
const gateEl=document.getElementById("gate");
let W=0,H=0;
function resize(){
  W=innerWidth;H=innerHeight;
  [glc,fxc].forEach(c=>{c.width=W*DPR;c.height=H*DPR;c.style.width=W+"px";c.style.height=H+"px";});
  fx.setTransform(DPR,0,0,DPR,0,0);
  if(gl){gl.viewport(0,0,glc.width,glc.height);}
}

const cfg={ rgb:[0.90,0.525,0.227], target:3, phrases:[], css:"#E6863A", closing:"", system:null };

/* ---------- WebGL 炎（乱流ノイズ・発光） ---------- */
let gl=null, prog=null, U={};
const VS=`attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
const FS=`
precision highp float;
uniform vec2 uRes; uniform float uTime, uScale, uAlpha, uHeat, uBaseY; uniform vec3 uColor;
float hash(vec2 p){p=fract(p*vec2(123.34,345.45));p+=dot(p,p+34.345);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);
  float a=hash(i),b=hash(i+vec2(1.,0.)),c=hash(i+vec2(0.,1.)),d=hash(i+vec2(1.,1.));
  vec2 u=f*f*(3.-2.*f);return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);}
void main(){
  vec2 uv=gl_FragCoord.xy/uRes; float aspect=uRes.x/uRes.y;
  vec2 p=uv-vec2(0.5,uBaseY); p.x*=aspect;
  float R=0.11*uScale;
  float d=length(p)/max(R,0.001);
  float breath=0.94+0.06*sin(uTime*0.7);              // 呼吸のような微かな明滅
  float shim=0.9+0.1*noise(p*7.0+uTime*0.15);         // 内側のかすかな揺らぎ
  float body=smoothstep(1.05,0.10,d);                 // 芯は不透明、縁で減衰
  float halo=exp(-d*d*1.5)*0.42;                       // 柔らかな暈
  float inten=(body+halo)*breath*shim;
  float whiteness=clamp(smoothstep(0.55,0.0,d)+(uHeat-0.7)*1.15,0.0,1.0); // 中心白熱、熱で外へ
  vec3 base=uColor, col=mix(base,vec3(1.0),whiteness);
  float alpha=clamp(inten,0.0,1.0)*uAlpha;
  gl_FragColor=vec4(col,alpha);
}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.warn(gl.getShaderInfoLog(s));return s;}
function initGL(){
  gl=glc.getContext("webgl",{alpha:true,premultipliedAlpha:false,antialias:true});
  if(!gl) return false;
  prog=gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));
  gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,"a"); gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  ["uRes","uTime","uScale","uAlpha","uHeat","uBaseY","uColor"].forEach(k=>U[k]=gl.getUniformLocation(prog,k));
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.clearColor(0,0,0,0);
  return true;
}

/* ---------- 状態 ---------- */
const BASE_Y=0.44, REST=0.9, GROW=0.13, INHALE_SEC=4.2, BLOOM_BIG=2.1, BLOOM_EXPAND=5.0;

const inductEl=document.getElementById("induct");

let inductActive=false, iIdx=0, iPhase="in", iT=0, inductDepth=0, inductBreath=6.0, inductPulse=0, inductPulseV=0;
let diving=false, diveT=0, divePhase="";
const BASE_LINES=[

function buildInductLines(){

  if(sys) L.push({t:sys.mei, mei:1});                                  // 銘＝入口の一言

    if(i===15 && sys && sys.deep) sys.deep.forEach(t=>L.push({t})); });// 深化に系統の一文
  return L;
}
function lineTiming(L){ return {fin:FADE,hold:HOLD[inductTempo],fout:FADE}; }
function setupLine(i){
  iIdx=i; iPhase="in"; iT=0; const L=LINES[i];
  inductDepth=Math.min(1.0, i/(LINES.length-3));
  if(L.count) inductPulseV+=3.0;
  inductTextEl.classList.toggle("count", !!L.count); inductTextEl.classList.remove("final");
  inductTextEl.classList.toggle("mei", !!L.mei);
  inductTextEl.innerHTML=esc(L.t); inductTextEl.style.opacity=0;
}
function nextLine(){ if(iIdx+1>=LINES.length){ diveStart(); return; } setupLine(iIdx+1); }
function updateInduction(dt){
  const tm=lineTiming(LINES[iIdx]); iT+=dt;
  if(iPhase==="in"){ inductTextEl.style.opacity=Math.min(1,iT/tm.fin);
    if(iT>=tm.fin){iPhase="hold";iT=0;inductTextEl.style.opacity=1;} }
  else if(iPhase==="hold"){ inductTextEl.style.opacity=1; if(iT>=tm.hold){iPhase="out";iT=0;} }
  else { inductTextEl.style.opacity=Math.max(0,1-iT/tm.fout); if(iT>=tm.fout) nextLine(); }
}
function startInduction(){
  inductActive=true; inductDepth=0; diving=false; inductPulse=0; inductPulseV=0;
  inductBreath=TEMPO[inductTempo].breath;

}

  else nextLine();                                                                                          // 次の文へ
}
function inductSkip(){ if(!inductActive||diving)return; diveStart(); }

function makeSprite(inner,mid){
  const s=64,c=document.createElement("canvas");c.width=c.height=s;
  const x=c.getContext("2d"),g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,inner);g.addColorStop(0.4,mid);g.addColorStop(1,"rgba(0,0,0,0)");
  x.fillStyle=g;x.fillRect(0,0,s,s);return c;
}
const sprBlue=makeSprite("rgba(232,242,255,1)","rgba(150,190,255,0.45)");

let particles=[];
function initParticles(){
  particles=[];
  for(let i=0;i<70;i++){
    const gold=Math.random()<0.22;
    particles.push({x:Math.random()*W,y:Math.random()*H,z:0.3+Math.random()*1.4,
      vx:(Math.random()-0.5)*0.15,vy:-(0.05+Math.random()*0.25),
      gold,ph:Math.random()*6.283,tw:0.4+Math.random()*0.9,a:0.22+Math.random()*0.5,decay:0});
  }
}
function goldRise(cx,cy){
  for(let i=0;i<30;i++){particles.push({x:cx+(Math.random()-0.5)*W*0.14,y:cy+(Math.random()-0.2)*70,
    z:0.4+Math.random()*1.0,vx:(Math.random()-0.5)*0.5,vy:-(0.35+Math.random()*1.1),
    gold:Math.random()<0.85,ph:Math.random()*6.283,tw:1+Math.random(),a:0.8,decay:0.3});}
}
function drawParticles(dt,t){
  fx.globalCompositeOperation="lighter";
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*p.z;p.y+=p.vy*p.z;
    if(p.decay){p.vx*=0.97;p.vy=p.vy*0.97+0.02;p.a-=dt*p.decay;if(p.a<=0){particles.splice(i,1);continue;}}
    else{ if(p.y<-40){p.y=H+40;p.x=Math.random()*W;} if(p.x<-40)p.x=W+40; if(p.x>W+40)p.x=-40; }
    const tw=0.55+0.45*Math.sin(t*p.tw+p.ph), size=7*p.z;
    fx.globalAlpha=Math.max(0,p.a)*tw;
    fx.drawImage(p.gold?sprGold:sprBlue,p.x-size,p.y-size,size*2,size*2);
  }
  fx.globalCompositeOperation="source-over";fx.globalAlpha=1;
}

/* ---------- 天から降りて球に吸われる言葉 ---------- */
function drawWords(){
  if(!cfg.phrases.length)return;
  if(mode==="bloom"||mode==="done")return;
  const lines=cfg.phrases,N=lines.length,cx=W/2;
  const topY=Math.max(H*0.14, 60), gap=Math.min(W,H)*0.075, orbY=H*(1-BASE_Y);
  const p=(mode==="inhaling")?flame.intake:0, seg=1/N;
  fx.textAlign="center";fx.textBaseline="middle";
  for(let k=0;k<N;k++){
    const restY=topY+k*gap;
    const start=(N-1-k)*seg;                       // 球に近い行（下）から先に吸われる
    const lp=Math.min(1,Math.max(0,(p-start)/seg));
    const y=restY+(orbY-restY)*easeIn(lp);         // 天 → 球中心へ降下
    const a=(mode==="inhaling")?0.92*(1-lp*0.92):0.42;
    if(a<=0.02)continue;
    fx.globalAlpha=a;fx.fillStyle="rgba(224,236,255,1)";
    fx.shadowColor="rgba(150,190,255,.75)";fx.shadowBlur=13;
    const fs=Math.min(W,H)*0.044*(1-lp*0.28);
    fx.font=fs+'px "Hiragino Mincho ProN","Yu Mincho",serif';
    fx.fillText(lines[k],cx,y);
  }
  fx.shadowBlur=0;fx.globalAlpha=1;
}

function drawFallback(t,scale,cx,cy){
  const R=Math.min(W,H)*0.11*scale*(0.96+Math.sin(t*0.7)*0.04);
  const white=Math.min(1,(flame.bloom>0?0.4+flame.bloom:0.35));
  fx.save();fx.globalCompositeOperation="lighter";fx.globalAlpha=flame.alpha;
  const grd=fx.createRadialGradient(cx,cy,0,cx,cy,R*1.6);

  fx.restore();fx.globalCompositeOperation="source-over";fx.globalAlpha=1;

/* ============================================================ */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;const t=now/1000;
  fx.clearRect(0,0,W,H);
  const cx=W/2, cy=H*(1-BASE_Y);

  /* ダイブ：白に満ちる → 「ひとつになっている」→ 文字が消える → 光が中央へ集まり闇の一点に収まる */
  if(diving){
    diveT+=dt;
    if(divePhase==="flood"){
      flashEl.style.opacity=Math.min(1,diveT/1.3);
      inductDepth=Math.min(3.2, inductDepth+dt*2.2);          // 光が全体へ広がる
      if(diveT>=1.3){ divePhase="whiteHold"; diveT=0; flashEl.style.opacity=1;
        inductTextEl.classList.remove("count"); inductTextEl.classList.add("final");
        inductTextEl.textContent="ひとつになっている"; inductTextEl.style.opacity=0; }
    }else if(divePhase==="whiteHold"){
      flashEl.style.opacity=1;
      if(diveT>=1.5){ divePhase="finalIn"; diveT=0; }         // 無音の間
    }else if(divePhase==="finalIn"){
      inductTextEl.style.opacity=Math.min(1,diveT/3.0);       // 白地にジワッと
      if(diveT>=3.0){ divePhase="finalHold"; diveT=0; }
    }else if(divePhase==="finalHold"){
      if(diveT>=2.4){ divePhase="finalOut"; diveT=0; }
    }else if(divePhase==="finalOut"){
      inductTextEl.style.opacity=Math.max(0,1-diveT/1.5);     // 文字が消える
      if(diveT>=1.5){ divePhase="converge"; diveT=0; inductEl.classList.remove("on"); }
    }else if(divePhase==="converge"){ /* 白のまま、光が中央の一点へ集まる */
      flashEl.style.opacity=Math.max(0,1-diveT/0.6);          // 白い覆いは引く（地は白のまま）
      inductDepth=3.2*(1-easeOut(Math.min(1,diveT/2.0)));     // 収束（2秒）
      if(diveT>=2.0){ divePhase="nightfall"; diveT=0; inductDepth=0; }
    }else{ /* nightfall：収束のあと、3秒かけて白→闇へジワリ（光は灯ったまま） */
      nightfallEl.style.opacity=Math.min(1,diveT/3.0);
      if(diveT>=3.0){ document.body.classList.add("dark"); nightfallEl.style.opacity=0;
        diving=false; inductActive=false; beginPractice(); }
    }
  }

  /* 入り口：闇に青白の光と一句 */
  if(mode==="gate"){
    if(hasGL) gl.clear(gl.COLOR_BUFFER_BIT);
    drawGateOrb(t);
    requestAnimationFrame(frame); return;
  }

  /* 誘導中：白地に選んだ色の光（呼吸で膨張収縮・徐々に深化） */
  if(mode==="induct"){
    if(hasGL) gl.clear(gl.COLOR_BUFFER_BIT);
    inductPulseV+=(-40*inductPulse-9*inductPulseV)*dt; inductPulse+=inductPulseV*dt;
    if(!diving) updateInduction(dt);
    drawInductOrb(t);
    requestAnimationFrame(frame); return;
  }

  if(mode!=="setup"){
    if(mode==="inhaling"){
      if(holding){
        const ease=0.6+0.8*Math.sin(flame.intake*Math.PI);
        flame.intake+=dt/INHALE_SEC*ease;
        if(flame.intake>=1){
          flame.intake=0;flame.count++;flame.pv+=3.4;buzz(18);
          if(flame.count>=cfg.target)startBloom();
          else{mode="settle";settleT=0;restNeeded=true;say("もう、ひと息");}
        }
      }else{flame.intake-=dt*1.4;if(flame.intake<=0){flame.intake=0;mode="idle";}}
    }
    if(mode==="settle"){settleT+=dt;if(settleT>1.3&&!holding)mode="idle";}
    if(mode==="bloom"){flame.bloom+=dt/2.6;if(flame.bloom>=1){flame.bloom=1;mode="done";}
      if(flame.bloom>0.62)flame.alpha=1-(flame.bloom-0.62)/0.38;}
    if(mode==="done")flame.alpha+=(0-flame.alpha)*dt*0.8;
    flame.pv+=(-42*flame.pulse-9*flame.pv)*dt; flame.pulse+=flame.pv*dt;

    const gstep=BLOOM_BIG/Math.max(1,cfg.target);
    const bloomScale=1+easeOut(flame.bloom)*BLOOM_EXPAND;
    const scale=REST*(1+gstep*(flame.count+flame.intake))*(1+flame.pulse)*bloomScale;
    const heat=Math.min(2.0,0.7+0.5*flame.intake+flame.bloom*1.3);
    if(!diving) flashEl.style.opacity=Math.min(1,Math.max(0,(flame.bloom-0.4)/0.55));

    if(hasGL){
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform2f(U.uRes,glc.width,glc.height);
      gl.uniform1f(U.uTime,t); gl.uniform1f(U.uScale,scale);
      gl.uniform1f(U.uAlpha,flame.alpha); gl.uniform1f(U.uHeat,heat);
      gl.uniform1f(U.uBaseY,BASE_Y); gl.uniform3f(U.uColor,cfg.rgb[0],cfg.rgb[1],cfg.rgb[2]);
      gl.drawArrays(gl.TRIANGLES,0,3);
    }else drawFallback(t,scale,cx,cy);

    drawParticles(dt,t);
    drawWords();
  } else {
    drawParticles(dt,t);   // 設定中も闇に粒が舞う
  }
  requestAnimationFrame(frame);
}

}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");}
function balanceBreak(s){                     // 明示改行は尊重。長い一句は中央付近の区切りで2行に
  if(!s||s.indexOf("\n")>=0||s.length<=16) return s;
  const mid=s.length/2; let best=-1,bd=1e9;
  for(let i=0;i<s.length-1;i++){ if(s[i]==="、"||s[i]==="。"){ const d=Math.abs(i-mid); if(d<bd){bd=d;best=i;} } }
  return best<0 ? s : s.slice(0,best+1)+"\n"+s.slice(best+1);
}

function hexToRgb(h){h=h.replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");
  const n=parseInt(h,16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];}
function resolveColor(str){
  str=(str||"").trim();
  if(/^#?[0-9a-fA-F]{6}$/.test(str)) return (str[0]==="#"?str:"#"+str).toUpperCase();
  if(/^#?[0-9a-fA-F]{3}$/.test(str)){const h=str.replace("#","");return("#"+h.split("").map(c=>c+c).join("")).toUpperCase();}
  if(JP[str]) return JP[str];
  const el=document.createElement("div"); el.style.color=""; el.style.color=str;
  if(el.style.color==="") return null;
  document.body.appendChild(el);const c=getComputedStyle(el).color;document.body.removeChild(el);
  const m=c.match(/(\d+),\s*(\d+),\s*(\d+)/); if(!m) return null;
  const to=x=>(+x).toString(16).padStart(2,"0");
  return ("#"+to(m[1])+to(m[2])+to(m[3])).toUpperCase();
}

function hexToHsl(hex){const rgb=hexToRgb(hex),r=rgb[0],g=rgb[1],b=rgb[2];
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    if(mx===r)h=(g-b)/d+(g<b?6:0);else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6;}
  return[Math.round(h*360),Math.round(s*100),Math.round(l*100)];}
function hslToHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,
  a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  const to=x=>Math.round(x*255).toString(16).padStart(2,"0");
  return("#"+to(f(0))+to(f(8))+to(f(4))).toUpperCase();}

  sS.style.background="linear-gradient(90deg,hsl("+h+",8%,55%),hsl("+h+",95%,52%))";
  sL.style.background="linear-gradient(90deg,#0a0c18,hsl("+h+",80%,55%),#eef3ff)";}
function fromSliders(){setColor(hslToHex(+sH.value,+sS.value,+sL.value));markSwatch(null);paintTracks();}

function drawGateOrb(t){
  const cx=W/2, cy=H*(1-BASE_Y), col="#bcd4ff";
  const bp=Math.sin(t*2*Math.PI/6.5);
  const R=Math.min(W,H)*0.1*(1+0.12*bp);
  fx.save();
  let g=fx.createRadialGradient(cx,cy,0,cx,cy,R*1.9);
  g.addColorStop(0,col); g.addColorStop(0.5,col+"44"); g.addColorStop(1,col+"00");
  fx.globalAlpha=0.55; fx.fillStyle=g; fx.beginPath();fx.arc(cx,cy,R*1.9,0,6.283);fx.fill();
  fx.globalAlpha=1;
  g=fx.createRadialGradient(cx,cy,0,cx,cy,R);
  g.addColorStop(0,"rgba(255,255,255,0.97)"); g.addColorStop(0.42,col); g.addColorStop(1,col+"00");
  fx.fillStyle=g; fx.beginPath();fx.arc(cx,cy,R,0,6.283);fx.fill();
  fx.restore();
}
const gQ=document.getElementById("gate-quote"), gS=document.getElementById("gate-src"), gGo=document.getElementById("gate-go");
function initGate(){
  const pick=QUOTES[Math.floor(Math.random()*QUOTES.length)];
  gQ.innerHTML=esc(balanceBreak(pick.q)); gS.textContent=pick.s;
  document.body.classList.remove("dark");
  nightfallEl.style.opacity=1;                       // 闇の入り口
  document.getElementById("veil").classList.add("hide");
  gateEl.classList.add("on"); mode="gate";
  setTimeout(()=>{ gQ.style.opacity=1; gS.style.opacity=1; gGo.style.opacity=1; }, 400);
}
let gateGone=false;
function gateGo(){
  if(gateGone||mode!=="gate")return; gateGone=true;
  [gQ,gS,gGo].forEach(el=>{ el.style.transition="opacity .6s ease"; el.style.opacity=0; });
  const veil=document.getElementById("veil");
  renderHome(); showStep(store.length?"home":"color");
  veil.style.transition="opacity 3s ease";           // 夜明け：白のホームが3秒かけて明ける
  requestAnimationFrame(()=>veil.classList.remove("hide"));
  setTimeout(()=>{
    mode="setup"; gateEl.classList.remove("on"); nightfallEl.style.opacity=0;
    veil.style.transition="opacity .8s ease";
  }, 3000);
}
gateEl.addEventListener("pointerdown",gateGo);
