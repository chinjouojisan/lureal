<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lureal">
<title>Lureal</title>
<style>
  :root{
    --void-0:#05060d; --void-1:#080b1a; --void-2:#0c1030;
    --ink:#e4ecff; --ink-soft:rgba(210,222,255,.62); --ink-faint:rgba(180,196,240,.34);
    --line:rgba(150,178,255,.16); --glow:#cfe0ff; --gold:#f2c94c;
    --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",-apple-system,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{color:var(--ink);font-family:var(--mincho);overflow:hidden;position:fixed;inset:0;
    -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:none;
    background:radial-gradient(120% 85% at 50% 52%, #ffffff 0%, #f5f7fc 68%, #eef1f8 100%);
    background-attachment:fixed;}
  body.dark{background:
      radial-gradient(120% 85% at 50% 56%, #04050c 0%, #070b1e 55%, #0b1236 100%),
      radial-gradient(100% 70% at 50% -8%, #101a44 0%, transparent 55%),
      linear-gradient(180deg, var(--void-1) 0%, var(--void-0) 100%);}
  #gl,#fx,#ripple{position:fixed;inset:0;width:100%;height:100%;display:block;}
  #gl{z-index:0;pointer-events:none;}
  #fx{z-index:1;pointer-events:auto;}
  #ripple{z-index:6;pointer-events:none;}

  #whisper{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 7vh);
    text-align:center;z-index:3;pointer-events:none;font-size:14px;letter-spacing:.28em;
    color:var(--ink-faint);transition:opacity 1.1s ease;opacity:0;
    text-shadow:0 0 18px rgba(150,185,255,.4);}
  #whisper.on{opacity:1;}
  #flash{position:fixed;inset:0;z-index:5;background:#ffffff;opacity:0;pointer-events:none;}
  #ending{position:fixed;left:0;right:0;top:44%;transform:translateY(-50%);text-align:center;
    z-index:6;pointer-events:none;}
  #ending.on{pointer-events:auto;}
  #ending-main{font-size:16px;letter-spacing:.3em;color:#161a2e;opacity:0;transition:opacity 3s ease;}
  #ending-sub{margin-top:26px;font-family:var(--sans);font-size:11px;letter-spacing:.24em;
    color:rgba(22,26,46,.5);opacity:0;transition:opacity 3s ease;}

  .veil{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:calc(env(safe-area-inset-top) + 30px) 26px calc(env(safe-area-inset-bottom) + 48px);
    transition:opacity .8s ease;
    --ink:#1b1f2e; --ink-soft:rgba(27,31,46,.64); --ink-faint:rgba(27,31,46,.36);
    --line:rgba(40,58,120,.20); --glow:#3a5bd0; --void-0:#ffffff;
    color:var(--ink);
    background:radial-gradient(120% 85% at 50% 42%, #ffffff 0%, #f6f8fd 66%, #eef1f8 100%);}
  .veil.hide{opacity:0;pointer-events:none;}
  .wordmark{font-size:15px;letter-spacing:.5em;color:var(--glow);text-shadow:0 0 20px rgba(160,195,255,.5);}
  .wordmark .en{display:block;font-family:var(--sans);font-size:9px;letter-spacing:.42em;
    color:var(--ink-faint);margin-top:8px;font-weight:300;text-shadow:none;}
  .step{width:100%;max-width:400px;margin-top:32px;display:none;flex-direction:column;align-items:center;}
  .step.on{display:flex;}
  .ask{font-size:14px;letter-spacing:.2em;color:var(--ink-soft);margin-bottom:18px;text-align:center;line-height:1.9;}

  .seg{display:flex;margin-bottom:20px;border:1px solid var(--line);border-radius:999px;overflow:hidden;}
  .seg button{font-family:var(--sans);font-size:12px;letter-spacing:.12em;color:var(--ink-soft);
    background:transparent;border:none;padding:11px 22px;cursor:pointer;transition:.2s;}
  .seg button.on{background:var(--glow);color:var(--void-0);}

  .rseg{display:flex;margin-bottom:14px;border:1px solid var(--line);border-radius:999px;overflow:hidden;}
  .rseg button{font-family:var(--sans);font-size:12px;letter-spacing:.12em;color:var(--ink-soft);
    background:transparent;border:none;padding:9px 18px;cursor:pointer;transition:.2s;flex:1;}
  .rseg button.on{background:var(--glow);color:var(--void-0);}
  .rseg button[hidden]{display:none;}

  .ratio-wrap{width:100%;margin-bottom:16px;}
  .ratio-row{display:flex;align-items:center;justify-content:space-between;padding:5px 2px;}
  .ratio-row[hidden]{display:none;}
  .ratio-row .rlabel{font-family:var(--sans);font-size:12px;color:var(--ink-soft);width:52px;}
  .ratio-row .rbtns{display:flex;align-items:center;gap:14px;}
  .ratio-row .rval{font-size:17px;color:var(--glow);min-width:34px;text-align:center;}
  .ratio-row button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:transparent;
    color:var(--ink-soft);font-size:15px;cursor:pointer;line-height:1;}
  .ratio-row button:active{background:var(--glow);color:var(--void-0);}
  .ratio-hint{font-family:var(--sans);font-size:10.5px;color:var(--ink-faint);text-align:center;margin:2px 0 12px;}

  .picker{display:none;flex-direction:column;align-items:center;width:100%;}
  .picker.on{display:flex;}
  .swatches{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 12px;margin-bottom:18px;max-width:320px;}
  .swatches button{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;
    cursor:pointer;font-family:var(--mincho);font-size:9.5px;color:var(--ink-soft);letter-spacing:.04em;width:44px;}
  .swatches .dot{width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.14);transition:.15s;}
  .swatches button.on .dot{box-shadow:0 0 0 2px var(--void-0),0 0 0 3px var(--glow),0 0 14px 2px rgba(160,195,255,.5);}
  .sliders{width:100%;max-width:320px;display:flex;flex-direction:column;gap:15px;margin-bottom:16px;}
  .sliders label{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:12px;
    font-family:var(--sans);font-size:11px;letter-spacing:.08em;color:var(--ink-soft);}
  .sliders input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;outline:none;margin:0;}
  .sliders input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
    background:#f2f6ff;border:1px solid rgba(0,0,0,.3);box-shadow:0 0 8px rgba(160,195,255,.6);cursor:pointer;}
  .sliders input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#f2f6ff;
    border:1px solid rgba(0,0,0,.3);cursor:pointer;}
  #hex{font-family:var(--mincho);font-size:15px;color:var(--ink);background:transparent;
    border:none;border-bottom:1px solid var(--line);padding:9px 4px;width:220px;text-align:center;letter-spacing:.04em;}
  #hex::placeholder{color:var(--ink-faint);font-size:12px;}
  .preview-row{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px 0 18px;}
  .preview{width:48px;height:48px;border-radius:50%;transition:background .3s,box-shadow .3s;}
  .preview-hex{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-faint);letter-spacing:.08em;}

  .birth{display:none;flex-direction:column;align-items:center;width:100%;}
  .birth.on{display:flex;}
  .bstep{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:10px;}
  .bstep .lbl{font-size:13px;color:var(--ink-soft);letter-spacing:.1em;width:22px;text-align:center;}
  .bstep b{font-family:var(--mincho);font-size:30px;min-width:52px;text-align:center;font-weight:400;color:var(--glow);}
  .bstep button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:transparent;
    color:var(--ink);font-size:20px;cursor:pointer;line-height:1;}
  .bstep button:active{background:var(--glow);color:var(--void-0);}

  #mantra{width:100%;min-height:120px;background:rgba(140,160,230,.05);border:1px solid var(--line);border-radius:14px;
    color:var(--ink);font-family:var(--mincho);font-size:16px;line-height:2;padding:16px;resize:none;letter-spacing:.04em;}
  #mantra::placeholder{color:var(--ink-faint);}
  .hint{font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;color:var(--ink-faint);
    margin-top:14px;line-height:1.9;text-align:center;}

  .counter{display:flex;align-items:center;gap:26px;margin-bottom:8px;}
  .counter button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:transparent;
    color:var(--ink);font-size:22px;font-family:var(--mincho);cursor:pointer;line-height:1;transition:.15s;}
  .counter button:active{background:var(--glow);color:var(--void-0);}
  .counter .n{font-size:40px;letter-spacing:.04em;min-width:64px;text-align:center;color:var(--glow);}
  .counter .n small{font-size:14px;color:var(--ink-faint);margin-left:4px;}

  .il-toggle{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 4px;
    font-family:var(--sans);font-size:12px;letter-spacing:.1em;color:var(--ink-soft);cursor:pointer;}
  .il-toggle input{width:18px;height:18px;}
  #il-editor{display:none;width:100%;max-width:400px;margin-top:12px;}
  #il-editor.on{display:block;}
  .il-list{display:flex;flex-direction:column;gap:8px;max-height:44vh;overflow-y:auto;padding:2px;}
  .il-card{border:1px solid var(--line);border-radius:12px;padding:10px 10px 8px;background:rgba(255,255,255,.5);}
  .il-card textarea{width:100%;box-sizing:border-box;border:none;background:transparent;resize:none;
    font-family:var(--mincho);font-size:14px;color:var(--ink);line-height:1.5;padding:0;margin-bottom:6px;}
  .il-row2{display:flex;align-items:center;gap:8px;font-family:var(--sans);font-size:11px;color:var(--ink-faint);}
  .il-row2 input[type=number]{width:52px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;
    font-family:var(--sans);font-size:12px;text-align:center;background:transparent;color:var(--ink);}
  .il-row2 label{display:flex;align-items:center;gap:4px;}
  .il-btns{margin-left:auto;display:flex;gap:4px;}
  .il-btns button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:transparent;
    color:var(--ink-soft);font-size:13px;cursor:pointer;line-height:1;}
  .il-btns button:active{background:var(--glow);color:var(--void-0);}
  .il-actions{display:flex;justify-content:center;gap:10px;margin-top:12px;}
  .il-actions button{font-family:var(--sans);font-size:11px;letter-spacing:.08em;color:var(--ink-soft);
    background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;}

  .go{margin-top:36px;font-family:var(--mincho);font-size:15px;letter-spacing:.34em;color:var(--glow);
    background:transparent;border:1px solid var(--glow);border-radius:999px;padding:15px 44px;cursor:pointer;transition:.2s;
    box-shadow:0 0 20px rgba(160,195,255,.18);}
  .go:active{background:var(--glow);color:var(--void-0);}
  .back{margin-top:18px;font-family:var(--sans);font-size:11px;letter-spacing:.2em;color:var(--ink-faint);
    background:transparent;border:none;cursor:pointer;padding:8px;}
  /* ホーム／ひな型チップ／保存 */
  .prayer-list{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .prayer{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;
    background:rgba(140,160,230,.05);cursor:pointer;transition:.15s;}
  .prayer:active{background:rgba(140,160,230,.14);}
  .prayer .pd{width:20px;height:20px;border-radius:50%;flex:0 0 auto;}
  .prayer .pn{flex:1;text-align:left;font-size:15px;letter-spacing:.05em;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .prayer .px{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:none;background:transparent;
    color:var(--ink-faint);font-size:17px;cursor:pointer;line-height:1;}
  .prayer .px:active{color:var(--ink);}
  .empty-note{font-family:var(--sans);font-size:12px;color:var(--ink-faint);letter-spacing:.1em;margin:18px 0 4px;text-align:center;}
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:14px;}
  .chips button{font-family:var(--mincho);font-size:12.5px;letter-spacing:.08em;color:var(--ink-soft);
    background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 15px;cursor:pointer;transition:.15s;}
  .chips button:active{background:var(--glow);color:var(--void-0);}
  .save-row{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:340px;margin-top:24px;
    padding-top:20px;border-top:1px solid var(--line);}
  .save-toggle{display:flex;align-items:center;gap:11px;font-family:var(--sans);font-size:12.5px;letter-spacing:.08em;
    color:var(--ink-soft);cursor:pointer;}
  .save-toggle .box{width:20px;height:20px;border-radius:5px;border:1px solid var(--line);display:flex;align-items:center;
    justify-content:center;font-size:13px;color:var(--void-0);line-height:1;}
  .save-toggle.on .box{background:var(--glow);}
  #save-name{font-family:var(--mincho);font-size:15px;color:var(--ink);background:transparent;border:none;
    border-bottom:1px solid var(--line);padding:8px 4px;width:240px;text-align:center;letter-spacing:.04em;display:none;}
  #save-name.on{display:block;}
  #save-name::placeholder{color:var(--ink-faint);}
  /* 白背景モード（誘導・のちに設定も） */
  #induct{position:fixed;inset:0;z-index:7;display:none;}
  #induct.on{display:block;}
  #induct-text{position:fixed;left:0;right:0;top:21%;text-align:center;padding:0 34px;
    font-family:var(--mincho);font-size:20px;letter-spacing:.16em;line-height:2;color:#161a2e;
    opacity:0;transition:opacity .6s ease;}
  #induct-text.count{font-size:46px;letter-spacing:.32em;}
  #induct-text.mei{font-size:23px;letter-spacing:.26em;color:#2a3352;}
  #induct-text.final{top:52%;transform:translateY(calc(-50% - 3em));}
  #induct-skip{position:fixed;left:0;right:0;bottom:11%;text-align:center;
    font-family:var(--sans);font-size:12px;letter-spacing:.26em;color:rgba(22,26,46,.42);cursor:pointer;}
  .induct-seg{margin-top:18px;}
  #nightfall{position:fixed;inset:0;z-index:0;opacity:0;pointer-events:none;
    background:
      radial-gradient(120% 85% at 50% 56%, #04050c 0%, #070b1e 55%, #0b1236 100%),
      linear-gradient(180deg,#080b1a,#05060d);}
  #gate{position:fixed;inset:0;z-index:8;display:none;}
  #gate.on{display:block;}
  #gate-quote{position:fixed;left:0;right:0;top:21%;padding:0 34px;text-align:center;
    font-family:var(--mincho);font-size:19px;line-height:2.1;letter-spacing:.09em;color:#eef3ff;
    opacity:0;transition:opacity 1.6s ease;text-shadow:0 0 22px rgba(150,185,255,.28);}
  #gate-src{position:fixed;left:0;right:0;top:69%;text-align:center;font-family:var(--sans);
    font-size:11px;letter-spacing:.2em;color:rgba(210,222,255,.42);opacity:0;transition:opacity 1.6s ease;}
  #gate-go{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 12%);text-align:center;
    font-family:var(--mincho);font-size:14px;letter-spacing:.36em;color:#cfe0ff;opacity:0;
    transition:opacity 1.6s ease;cursor:pointer;}
</style>
</head>
<body>
<div id="nightfall"></div>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<canvas id="ripple"></canvas>
<div id="gate"><div id="gate-quote"></div><div id="gate-src"></div><div id="gate-go">祈りへ</div></div>
<div id="whisper"></div>
<div id="flash"></div>
<div id="induct">
  <div id="induct-text"></div>
  <div id="induct-skip">スキップ</div>
</div>
<div id="ending"><div id="ending-main"></div><div id="ending-sub"></div></div>

<div class="veil" id="veil">
  <div class="wordmark">Lureal<span class="en">EMBER</span></div>

  <div class="step" id="step-home">
    <div class="ask">灯した祈り。</div>
    <div class="prayer-list" id="prayer-list"></div>
    <button class="go" id="new-prayer">＋ 新しい祈り</button>
  </div>

  <div class="step" id="step-color">
    <div class="ask">あなたに、応える色。</div>
    <div class="rseg" id="ccount-seg">
      <button data-n="1" class="on">1色</button>
      <button data-n="2">2色</button>
      <button data-n="3">3色</button>
    </div>
    <div class="rseg" id="role-seg" style="display:none">
      <button data-role="core" class="on">土台</button>
      <button data-role="support" hidden>補助</button>
      <button data-role="thema">目標</button>
    </div>
    <div class="ratio-wrap" id="ratio-wrap" style="display:none">
      <div class="ratio-row" data-role="core">
        <span class="rlabel">土台</span>
        <div class="rbtns"><button class="rminus" data-role="core">−</button><span class="rval" id="rval-core">1.9</span><button class="rplus" data-role="core">＋</button></div>
      </div>
      <div class="ratio-row" data-role="support" hidden>
        <span class="rlabel">補助</span>
        <div class="rbtns"><button class="rminus" data-role="support">−</button><span class="rval" id="rval-support">0.1</span><button class="rplus" data-role="support">＋</button></div>
      </div>
      <div class="ratio-row" data-role="thema">
        <span class="rlabel">目標</span>
        <div class="rbtns"><button class="rminus" data-role="thema">−</button><span class="rval" id="rval-thema">8.0</span><button class="rplus" data-role="thema">＋</button></div>
      </div>
      <div class="ratio-hint">育つほど、この比率が入れ替わっていきます</div>
    </div>
    <div class="seg">
      <button data-mode="pick" class="on">選ぶ</button>
      <button data-mode="birth">誕生日で</button>
    </div>

    <div class="preview-row">
      <div class="preview" id="cprev"></div>
      <div class="preview-hex" id="cprev-hex">#E6863A</div>
    </div>

    <div class="picker on" id="picker-wrap">
      <div class="swatches" id="swatches"></div>
      <div class="sliders">
        <label>色あい<input type="range" id="sH" min="0" max="360" value="30"></label>
        <label>あざやかさ<input type="range" id="sS" min="20" max="100" value="80"></label>
        <label>あかるさ<input type="range" id="sL" min="25" max="75" value="55"></label>
      </div>
      <input type="text" id="hex" spellcheck="false" placeholder="#コード や gold・indigo も（任意）">
    </div>

    <div class="birth" id="birth-wrap">
      <div class="bstep"><span class="lbl">月</span>
        <button data-b="m" data-d="-1">−</button><b id="bMonth">1</b><button data-b="m" data-d="1">＋</button></div>
      <div class="bstep"><span class="lbl">日</span>
        <button data-b="d" data-d="-1">−</button><b id="bDay">1</b><button data-b="d" data-d="1">＋</button></div>
      <div class="hint">生まれた月日から、ひとつの色を導きます</div>
    </div>

    <button class="go" id="color-next">この色に</button>
  </div>

  <div class="step" id="step-word">
    <div class="ask">炎に、食べさせる言葉。</div>
    <textarea id="mantra" placeholder="マントラ、祈り、自分で決めた一言。&#10;空のままでも、息だけを灯せます。"></textarea>
    <div class="chips" id="word-chips"></div>
    <div class="hint">ひと息で、この言葉をひとめぐり吸い込みます。ひな型はタップで入る（もう一度で次の候補）</div>
    <button class="go" id="word-next">つぎへ</button>
    <button class="back" id="word-back">← 色へ戻る</button>
  </div>

  <div class="step" id="step-closing">
    <div class="ask">結びの、ひとこと。</div>
    <textarea id="closing" placeholder="満ちたときに現れる言葉。&#10;空なら「祈りは、光になった」。"></textarea>
    <div class="chips" id="closing-chips"></div>
    <div class="hint">祈りが満ちた瞬間、白の中へ現れます</div>
    <button class="go" id="closing-next">つぎへ</button>
    <button class="back" id="closing-back">← 言葉へ戻る</button>
  </div>

  <div class="step" id="step-count">
    <div class="ask">いくつの息を、捧げる。</div>
    <div class="counter">
      <button id="minus">−</button>
      <div class="n"><span id="count-n">3</span><small>息</small></div>

</div>

<script>
/* ============================================================
   Lureal / EMBER  ── 闇に灯す、その場限りの光
   色は燃料、言葉は糧、粒は幸運（青白＋金）。記録しない。
   ============================================================ */
const DPR=Math.min(window.devicePixelRatio||1,2);
const glc=document.getElementById("gl"), fxc=document.getElementById("fx"), rpc=document.getElementById("ripple");
const fx=fxc.getContext("2d");
const rpx=rpc.getContext("2d");
const flashEl=document.getElementById("flash");
const nightfallEl=document.getElementById("nightfall");
const gateEl=document.getElementById("gate");
let W=0,H=0;
function resize(){
  W=innerWidth;H=innerHeight;
  [glc,fxc,rpc].forEach(c=>{c.width=W*DPR;c.height=H*DPR;c.style.width=W+"px";c.style.height=H+"px";});
  fx.setTransform(DPR,0,0,DPR,0,0);
  rpx.setTransform(DPR,0,0,DPR,0,0);
  if(gl){gl.viewport(0,0,glc.width,glc.height);}
}

const cfg={ rgb:[0.90,0.525,0.227], target:3, phrases:[], css:"#E6863A", closing:"", system:null,
  colors:{core:null,support:null,thema:null}, colorCount:1, ratio:{core:1.9,support:0.1,thema:8.0}, inductLines:null };

/* ---------- WebGL 炎（乱流ノイズ・発光） ---------- */
let gl=null, prog=null, U={};
const VS=`attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
const FS=`
precision highp float;
uniform vec2 uRes; uniform float uTime, uScale, uAlpha, uHeat, uBaseY, uB1, uB2; uniform vec3 uCore, uSupport, uThema;
float hash(vec2 p){p=fract(p*vec2(123.34,345.45));p+=dot(p,p+34.345);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);
  float a=hash(i),b=hash(i+vec2(1.,0.)),c=hash(i+vec2(0.,1.)),d=hash(i+vec2(1.,1.));
  vec2 u=f*f*(3.-2.*f);return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);}
void main(){
  vec2 uv=gl_FragCoord.xy/uRes; float aspect=uRes.x/uRes.y;
  vec2 p=uv-vec2(0.5,uBaseY); p.x*=aspect;
  float R=0.11*uScale;
  float d=length(p)/max(R,0.001);
  float breath=0.94+0.06*sin(uTime*0.7);              // 呼吸のような微かな明滅
  float shim=0.9+0.1*noise(p*7.0+uTime*0.15);         // 内側のかすかな揺らぎ
  float body=smoothstep(1.05,0.10,d);                 // 芯は不透明、縁で減衰
  float halo=exp(-d*d*1.5)*0.42;                       // 柔らかな暈
  float inten=(body+halo)*breath*shim;
  float heatFall=smoothstep(0.8,0.2,d);                               // 白熱は中心ほど強く、外側（目標色の帯）にはほぼ効かない
  float whiteness=clamp(smoothstep(0.55,0.0,d)+(uHeat-0.7)*1.15*heatFall,0.0,1.0); // 中心白熱、熱で外へ（外側の色は必ず残る）
  float band=0.02;                                     // 土台→補助→目標、境界だけ軽くぼかし、帯そのものは独立して見える
  vec3 base=mix(uCore,uSupport,smoothstep(uB1-band,uB1+band,d));
  base=mix(base,uThema,smoothstep(uB2-band,uB2+band,d));
  vec3 col=mix(base,vec3(1.0),whiteness);
  float alpha=clamp(inten,0.0,1.0)*uAlpha;
  gl_FragColor=vec4(col,alpha);
}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.warn(gl.getShaderInfoLog(s));return s;}
function initGL(){
  gl=glc.getContext("webgl",{alpha:true,premultipliedAlpha:false,antialias:true});
  if(!gl) return false;
  prog=gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));
  gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,"a"); gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  ["uRes","uTime","uScale","uAlpha","uHeat","uBaseY","uB1","uB2","uCore","uSupport","uThema"].forEach(k=>U[k]=gl.getUniformLocation(prog,k));
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.clearColor(0,0,0,0);
  return true;
}
const hasGL=initGL();

/* ---------- 状態 ---------- */
const BASE_Y=0.44, REST=0.9, GROW=0.13, INHALE_SEC=4.2, BLOOM_BIG=2.1, BLOOM_EXPAND=5.0;
const flame={count:0,intake:0,absorbed:0,lineProg:0,pulse:0,pv:0,bloom:0,alpha:1};
let mode="setup", holding=false, settleT=0, restNeeded=false;

/* ===== 催眠誘導（凝視・白背景・光と繋がる。フレーム駆動でジワッと） ===== */
const inductEl=document.getElementById("induct");
const inductTextEl=document.getElementById("induct-text");
const inductSkipEl=document.getElementById("induct-skip");
let inductTempo=1;
const TEMPO=[{breath:8.0},{breath:6.0},{breath:4.5}];   // 呼吸周期のみ（速さは滞在で調整）
const FADE=6.0;                                          // 出る/消える＝6秒（holdなし）
const INDUCT_EXPAND=0.32, INDUCT_CONTRACT=0.20;          // 可動域を拡大。膨張率＞収縮率で、じわじわ育っていく
let inductActive=false, iIdx=0, iPhase="in", iT=0, inductLevel=0, inductPeak=0, inductBreath=6.0;
let inductDepth=0;   // ダイブ演出（収束・拡散）専用。誘導中の光の大きさとは別管理
let diving=false, diveT=0, divePhase="";
const BASE_LINES=[
  {t:"さあ楽にして、光を見つめて"},
  {t:"呼吸を整えよう"},
  {t:"息を吸って……"},
  {t:"ゆっくり息を吐いて……"},
  {t:"光がふくらむ。"},
  {t:"光がゆるむ。"},
  {t:"肩の力が抜けていく"},
  {t:"うでも、あしも、軽くなる"},
  {t:"見つめるほど、光を感じる"},
  {t:"光があなたをつつみ"},
  {t:"ひとつになる。"},
  {t:"あなたと光が近づいていく"},
  {t:"光と、つながっていく"},
  {t:"光に、つつまれていく"},
  {t:"もっと、深く。"},
  {t:"光とつながる"},
  {t:"3つ数える"},
  {t:"光とあなたがひとつになる"},
  {t:"3",count:1},
  {t:"2",count:1},
  {t:"1",count:1}
];
let LINES=BASE_LINES;
function buildInductLines(){
  const sys=SYSTEMS.find(s=>s.key===cfg.system);
  const L=[];
  if(sys) L.push({t:sys.mei, mei:1, dur:FADE*2});                       // 銘＝入口の一言
  BASE_LINES.forEach((ln,i)=>{ L.push({...ln, dur: ln.count?3:FADE*2});
    if(i===15 && sys && sys.deep) sys.deep.forEach(t=>L.push({t, dur:FADE*2})); });// 深化に系統の一文
  return L;
}
function lineTiming(L){ const d=(L&&typeof L.dur==="number")?L.dur:(L&&L.count?3:FADE*2); return {fin:d/2,fout:d/2}; }
function curFade(){ const L=LINES[iIdx]; return L?lineTiming(L).fin:FADE; }   // 各行のdur（合計時間）を半分に分けてfin/foutにする
function setupLine(i){
  iIdx=i; iPhase="in"; iT=0; const L=LINES[i];
  inductPeak=inductLevel+INDUCT_EXPAND+(L.count?0.25:0);   // 数を数える行は、少し大きめに膨らむ
  inductTextEl.classList.toggle("count", !!L.count); inductTextEl.classList.remove("final");
  inductTextEl.classList.toggle("mei", !!L.mei);
  inductTextEl.innerHTML=esc(L.t); inductTextEl.style.opacity=0;
}
function nextLine(){ if(iIdx+1>=LINES.length){ diveStart(); return; } setupLine(iIdx+1); }
function updateInduction(dt){
  iT+=dt; const f=curFade();
  if(iPhase==="in"){
    inductTextEl.style.opacity=Math.min(1,iT/f);
    if(iT>=f){ iPhase="out"; iT=0; inductTextEl.style.opacity=1; inductLevel=inductPeak-INDUCT_CONTRACT; }  // holdなし、即座に縮みへ
  } else {
    inductTextEl.style.opacity=Math.max(0,1-iT/f);
    if(iT>=f) nextLine();
  }
}
function easeInOutSine(p){ return 0.5-0.5*Math.cos(Math.PI*p); }   // 両端で速度ゼロ→切り替わりでカクッとならない
function inductLightDepth(){                             // 光の膨張・収縮（テキストのfin/foutと連動）
  const p=Math.min(1,iT/curFade()), e=easeInOutSine(p);
  if(iPhase==="in") return inductLevel+INDUCT_EXPAND*e;
  return inductPeak-INDUCT_CONTRACT*e;
}
function inductHeat(){                                    // 膨張の頂点で白熱が増し、土台・補助の色を飲み込む（目標色は外側に必ず残す）
  const p=Math.min(1,iT/curFade()), e=easeInOutSine(p);
  return iPhase==="in" ? (0.7+0.7*e) : (0.7+0.7*(1-e));
}
function startInduction(){
  inductActive=true; inductLevel=0; inductPeak=INDUCT_EXPAND; diving=false;
  LINES=(cfg.inductLines&&cfg.inductLines.length)?cfg.inductLines.map(l=>({...l})):buildInductLines();  // カスタムがあればそちらを使う
  document.getElementById("veil").classList.add("hide");
  document.body.classList.remove("dark");
  inductEl.classList.add("on");
  inductTextEl.style.transition="none";
  inductSkipEl.style.opacity="1";
  setupLine(0); mode="induct";
}
function inductAdvance(){
  if(!inductActive||diving)return;
  if(iPhase==="in"){ iPhase="out"; iT=0; inductTextEl.style.opacity=1; inductLevel=inductPeak-INDUCT_CONTRACT; } // 出現を一気に完了、そのまま自然な収縮へ
  else nextLine();                                                                                          // 次の文へ
}
function inductSkip(){ if(!inductActive||diving)return; diveStart(); }
function diveStart(){ if(diving)return; diving=true; diveT=0; divePhase="flood";
  inductTextEl.style.opacity=0; inductSkipEl.style.opacity="0"; buzz([30,50,200]); }
inductEl.addEventListener("pointerdown",e=>{ if(e.target===inductSkipEl)return; inductAdvance(); });
inductSkipEl.addEventListener("pointerdown",e=>{ e.stopPropagation(); inductSkip(); });
/* ---------- 帰り道：開花をそのまま3回繰り返す（本編のGL描画・粒子をそのまま流用） ---------- */
const RING_DUR=21.05;   // 広がりきってから真っ白まで8秒になるよう調整（(1-0.62)*21.05≈8秒）
const WARP_BLOOM_EXPAND=10.5;   // 本編の開花(5.0)よりずっと大きく広がる。時間も同じ比率で伸ばしてあるので、序盤の広がる速さ（テンポ）は変わらない
let warpTextAlpha=0;   // 結びの文字（白・薄く）。最初のサイクルでじんわり現れ、最後の開花で一緒に白へ溶ける
function drawWarpText(t){
  if(mode!=="warpbloom"||warpTextAlpha<=0.01)return;
  const msg=(cfg.closing&&cfg.closing.trim())||"祈りは、光になった";
  const cx=W/2, cy=H*(1-BASE_Y);
  const flicker=0.75+0.25*Math.sin(t*0.55);
  fx.save();
  fx.globalAlpha=Math.min(0.32,warpTextAlpha*0.34)*flicker;   // 読めるか読めないかくらいの薄さ
  fx.fillStyle="rgba(255,255,255,1)";
  fx.shadowColor="rgba(255,255,255,0.9)"; fx.shadowBlur=Math.min(W,H)*0.05;
  fx.textAlign="center";
  fx.font=(Math.min(W,H)*0.052)+'px "Hiragino Mincho ProN","Yu Mincho",serif';
  fx.fillText(msg,cx,cy);
  fx.restore();
}

function buzz(m){try{if(navigator.vibrate)navigator.vibrate(m);}catch(e){}}
const whisper=document.getElementById("whisper");let wcur="";
function say(t){if(t===wcur)return;wcur=t;whisper.classList.remove("on");
  setTimeout(()=>{whisper.textContent=t;if(t)whisper.classList.add("on");},300);}
function easeOut(x){return 1-Math.pow(1-x,3);}
function easeIn(x){return x*x;}

/* ---------- 粒子（土台・補助・目標の3色。比率に応じて出現） ---------- */
function makeSprite(inner,mid){
  const s=64,c=document.createElement("canvas");c.width=c.height=s;
  const x=c.getContext("2d"),g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,inner);g.addColorStop(0.4,mid);g.addColorStop(1,"rgba(0,0,0,0)");
  x.fillStyle=g;x.fillRect(0,0,s,s);return c;
}
const sprBlue=makeSprite("rgba(232,242,255,1)","rgba(150,190,255,0.45)");
const sprGold=makeSprite("rgba(255,244,210,1)","rgba(242,201,76,0.5)");
function roleSpriteFor(hex){
  const rgb=hexToRgb(hex||"#E6863A");
  const inner="rgba("+Math.min(255,Math.round(rgb[0]*255+70))+","+Math.min(255,Math.round(rgb[1]*255+70))+","+Math.min(255,Math.round(rgb[2]*255+70))+",1)";
  const mid="rgba("+Math.round(rgb[0]*255)+","+Math.round(rgb[1]*255)+","+Math.round(rgb[2]*255)+",0.5)";
  return makeSprite(inner,mid);
}
let sprCore=sprGold, sprSupport=sprGold, sprThema=sprBlue;   // 初期値。実際の色は使用直前にrefreshRoleSprites()で反映
function refreshRoleSprites(){
  const coreHex=(cfg.colors.core&&cfg.colors.core.hex)||cfg.css||"#E6863A";
  const supportHex=(cfg.colors.support&&cfg.colors.support.hex)||coreHex;
  const themaHex=(cfg.colors.thema&&cfg.colors.thema.hex)||coreHex;
  sprCore=roleSpriteFor(coreHex); sprSupport=roleSpriteFor(supportHex); sprThema=roleSpriteFor(themaHex);
}
function pickRoleSprite(){                                    // 比率に応じて、どの色の粒子として生まれるかを決める
  const cc=cfg.colorCount, r=cfg.ratio;
  if(cc<=1) return sprCore;
  if(cc===2){ const sum=r.core+r.thema; return Math.random()*sum<r.core?sprCore:sprThema; }
  const sum=r.core+r.support+r.thema, x=Math.random()*sum;
  if(x<r.core) return sprCore;
  if(x<r.core+r.support) return sprSupport;
  return sprThema;
}
let particles=[];
function initParticles(){
  refreshRoleSprites();
  particles=[];
  for(let i=0;i<70;i++){
    particles.push({x:Math.random()*W,y:Math.random()*H,z:0.3+Math.random()*1.4,
      vx:(Math.random()-0.5)*0.15,vy:-(0.05+Math.random()*0.25),
      spr:pickRoleSprite(),ph:Math.random()*6.283,tw:0.4+Math.random()*0.9,a:0.22+Math.random()*0.5,decay:0});
  }
}
function goldRise(cx,cy){
  refreshRoleSprites();
  for(let i=0;i<30;i++){particles.push({x:cx+(Math.random()-0.5)*W*0.14,y:cy+(Math.random()-0.2)*70,
    z:0.4+Math.random()*1.0,vx:(Math.random()-0.5)*0.5,vy:-(0.35+Math.random()*1.1),
    spr:pickRoleSprite(),ph:Math.random()*6.283,tw:1+Math.random(),a:0.8,decay:0.3});}
}
function drawParticles(dt,t){
  const fadeMul=(mode==="warpbloom")?warpTextAlpha:1;   // ワープ中は、最後の開花でだけ粒子も一緒に白へ溶ける
  fx.globalCompositeOperation="lighter";
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*p.z;p.y+=p.vy*p.z;
    if(p.decay){p.vx*=0.97;p.vy=p.vy*0.97+0.02;p.a-=dt*p.decay;if(p.a<=0){particles.splice(i,1);continue;}}
    else{ if(p.y<-40){p.y=H+40;p.x=Math.random()*W;} if(p.x<-40)p.x=W+40; if(p.x>W+40)p.x=-40; }
    const tw=0.55+0.45*Math.sin(t*p.tw+p.ph), size=7*p.z;
    fx.globalAlpha=Math.max(0,p.a)*tw*fadeMul;
    fx.drawImage(p.spr,p.x-size,p.y-size,size*2,size*2);
  }
  fx.globalCompositeOperation="source-over";fx.globalAlpha=1;
}

/* ---------- 天から降りて球に吸われる言葉 ---------- */
function drawWords(){
  if(!cfg.phrases.length)return;
  if(mode==="bloom"||mode==="done")return;
  const lines=cfg.phrases,N=lines.length,cx=W/2;
  const topY=Math.max(H*0.14, 60), gap=Math.min(W,H)*0.075, orbY=H*(1-BASE_Y);
  const absorbing=(mode==="inhaling");
  fx.textAlign="center";fx.textBaseline="middle";
  for(let k=0;k<N;k++){
    if(absorbing && k<flame.absorbed) continue;             // 吸い終えた文（消えている）
    const restY=topY+k*gap;
    let y=restY, lp=0;
    if(absorbing && k===flame.absorbed){                    // いま吸っている文（最初から順に）
      lp=flame.lineProg;
      y=restY+(orbY-restY)*easeIn(lp);                      // 天 → 球中心へ降下
    }
    const a=absorbing?(k===flame.absorbed?0.92*(1-lp*0.9):0.5):0.42;  // 待機は淡く
    if(a<=0.02)continue;
    fx.globalAlpha=a;fx.fillStyle="rgba(224,236,255,1)";
    fx.shadowColor="rgba(150,190,255,.75)";fx.shadowBlur=13;
    const fs=Math.min(W,H)*0.044*(1-lp*0.28);
    fx.font=fs+'px "Hiragino Mincho ProN","Yu Mincho",serif';
    fx.fillText(lines[k],cx,y);
  }
  fx.shadowBlur=0;fx.globalAlpha=1;
}

/* ---------- 開花：球が膨らんで白く満ちる（放射なし） ---------- */
/* 球体そのものが uScale と uHeat の上昇で膨張・白熱する。個別描画は不要。 */

/* ---------- 2D フォールバック球（WebGL無い時・発光） ---------- */
function drawFallback(t,scale,cx,cy){
  const R=Math.min(W,H)*0.11*scale*(0.96+Math.sin(t*0.7)*0.04);
  const white=Math.min(1,(flame.bloom>0?0.4+flame.bloom:0.35));
  fx.save();fx.globalCompositeOperation="lighter";fx.globalAlpha=flame.alpha;
  const grd=fx.createRadialGradient(cx,cy,0,cx,cy,R*1.6);
  grd.addColorStop(0,"rgba(255,255,255,0.95)");
  layeredStops(currentGrowth(),1.6,0.15).forEach(([o,hex])=>grd.addColorStop(o,hex));
  grd.addColorStop(1,"rgba(0,0,0,0)");
  fx.fillStyle=grd;fx.beginPath();fx.arc(cx,cy,R*1.6,0,6.283);fx.fill();
  fx.restore();fx.globalCompositeOperation="source-over";fx.globalAlpha=1;
}

/* ============================================================ */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;const t=now/1000;
  fx.clearRect(0,0,W,H);
  rpx.clearRect(0,0,W,H);   // ワープは本編のGL描画＋粒子をそのまま使うため、この専用キャンバスはもう使わない
  const cx=W/2, cy=H*(1-BASE_Y);

  /* ダイブ：白に満ちる → 「ひとつになっている」→ 文字が消える → 光が中央へ集まり闇の一点に収まる */
  if(diving){
    diveT+=dt;
    if(divePhase==="flood"){
      flashEl.style.opacity=Math.min(1,diveT/FADE);
      inductDepth=3.2*easeInOutSine(Math.min(1,diveT/FADE));    // 光が全体へ広がる（誘導と同じ間合いで）
      if(diveT>=FADE){ divePhase="whiteHold"; diveT=0; flashEl.style.opacity=1; inductDepth=3.2;
        inductTextEl.classList.remove("count"); inductTextEl.classList.add("final");
        inductTextEl.textContent="ひとつになっている"; inductTextEl.style.opacity=0; }
    }else if(divePhase==="whiteHold"){
      flashEl.style.opacity=1;
      if(diveT>=2.0){ divePhase="finalIn"; diveT=0; }         // 無音の間
    }else if(divePhase==="finalIn"){
      inductTextEl.style.opacity=Math.min(1,diveT/FADE);      // 白地にジワッと（誘導と同じ間合いで）
      if(diveT>=FADE){ divePhase="finalHold"; diveT=0; }
    }else if(divePhase==="finalHold"){
      if(diveT>=3.0){ divePhase="finalOut"; diveT=0; }
    }else if(divePhase==="finalOut"){
      inductTextEl.style.opacity=Math.max(0,1-diveT/FADE);    // 文字が消える（誘導と同じ間合いで）
      if(diveT>=FADE){ divePhase="converge"; diveT=0; inductEl.classList.remove("on"); }
    }else if(divePhase==="converge"){ /* 白のまま、光が中央の一点へじっくり集まる。白い覆いも同じペースで引く。終盤ほどゆっくり */
      const CONVERGE_DUR=5.0, p=Math.min(1,diveT/CONVERGE_DUR),
            cp=p<0.5?16*p*p*p*p*p:1-Math.pow(-2*p+2,5)/2;         // 両端、特に終盤が極めてゆっくりなイージング
      flashEl.style.opacity=Math.max(0,1-cp);
      inductDepth=3.2*(1-cp);                                      // 収束（5秒、じっくりなめらかに）
      if(diveT>=CONVERGE_DUR){ divePhase="nightfall"; diveT=0; inductDepth=0; }
    }else{ /* nightfall：収束のあと、4秒かけて白→闇へジワリ（光は灯ったまま） */
      nightfallEl.style.opacity=easeInOutSine(Math.min(1,diveT/4.0));
      if(diveT>=4.0){ document.body.classList.add("dark"); nightfallEl.style.opacity=0;
        diving=false; inductActive=false; beginPractice(); }
    }
  }

  /* 入り口：闇に青白の光と一句 */
  if(mode==="gate"){
    if(hasGL) gl.clear(gl.COLOR_BUFFER_BIT);
    drawGateOrb(t);
    requestAnimationFrame(frame); return;
  }

  /* 誘導中：白地に本編と同じ光の玉（テキストと連動し3秒膨張・3秒収縮。膨張率>収縮率でじわじわ育つ） */
  if(mode==="induct"){
    if(!diving) updateInduction(dt);
    const depthNow=diving?inductDepth:inductLightDepth();   // ダイブ中は、ダイブ専用の深さをそのまま描画に反映する
    const baseScale=1+depthNow*1.5;
    const scale=REST*0.95*baseScale;
    if(hasGL){
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform2f(U.uRes,glc.width,glc.height);
      gl.uniform1f(U.uTime,t); gl.uniform1f(U.uScale,scale);
      gl.uniform1f(U.uAlpha,1); gl.uniform1f(U.uHeat,inductHeat());
      gl.uniform1f(U.uBaseY,BASE_Y);
      const growth=currentGrowth();
      const rb=roleBlend(growth);
      gl.uniform1f(U.uB1,rb.b1); gl.uniform1f(U.uB2,rb.b2);
      gl.uniform3f(U.uCore,rb.core[0],rb.core[1],rb.core[2]);
      gl.uniform3f(U.uSupport,rb.support[0],rb.support[1],rb.support[2]);
      gl.uniform3f(U.uThema,rb.thema[0],rb.thema[1],rb.thema[2]);
      gl.drawArrays(gl.TRIANGLES,0,3);
    }else drawFallback(t,scale,W/2,H*(1-BASE_Y));
    requestAnimationFrame(frame); return;
  }

  if(mode!=="setup"){
    if(mode==="inhaling"){
      const N=cfg.phrases.length, LC=N||1, dur=N?3.0:4.0;   // 1文3秒／言葉なしは4秒で1息
      if(holding){
        flame.lineProg+=dt/dur;
        if(flame.lineProg>=1){
          flame.lineProg=0; flame.absorbed++;
          if(N){flame.pv+=1.3;buzz(14);}                     // 一文を吸うたび、小さく脈打つ
          if(flame.absorbed>=LC){                            // 全文吸った＝1息完了
            flame.absorbed=0; flame.count++; flame.pv+=3.4; buzz(20);
            if(flame.count>=cfg.target)startBloom();
            else{mode="settle";settleT=0;restNeeded=true;say("もう、ひと息");}
          }
        }
      }
      // 離しても巻き戻さない（一時停止・吸った分は保持）
    }
    if(mode==="settle"){settleT+=dt;if(settleT>1.3&&!holding)mode="idle";}
    if(mode==="bloom"){flame.bloom+=dt/2.6;if(flame.bloom>=1){flame.bloom=1;mode="done";}
      if(flame.bloom>0.62)flame.alpha=1-(flame.bloom-0.62)/0.38;}
    if(mode==="warpbloom"){
      if(flame.alpha<1) flame.alpha=Math.min(1,flame.alpha+dt/0.8);       // じんわり現れる
      if(warpTextAlpha<1) warpTextAlpha=Math.min(1,warpTextAlpha+dt/0.8);
      flame.bloom+=dt/RING_DUR;                 // タイミングだけワープと同じ（5秒）。式は開花とそのまま同じ
      if(flame.bloom>=1){flame.bloom=1;nextWarpCycle();}
      if(flame.bloom>0.62){
        flame.alpha=1-(flame.bloom-0.62)/0.38;
        if(warpCyclesLeft===0) warpTextAlpha=flame.alpha;                 // 最後のサイクルだけ、文字も一緒に白へ溶ける
      }
    }
    if(mode==="done")flame.alpha+=(0-flame.alpha)*dt*0.8;
    flame.pv+=(-42*flame.pulse-9*flame.pv)*dt; flame.pulse+=flame.pv*dt;

    const gstep=BLOOM_BIG/Math.max(1,cfg.target);
    const bloomExpandNow=mode==="warpbloom"?WARP_BLOOM_EXPAND:BLOOM_EXPAND;   // ワープは本編よりずっと大きく、画面いっぱいまで広がる
    const bloomScale=1+easeOut(flame.bloom)*bloomExpandNow;
    const LCg=cfg.phrases.length||1;
    const breathFrac=(flame.absorbed+flame.lineProg)/LCg;   // この一息の進み（吸った分）
    const scale=REST*(1+gstep*(flame.count+breathFrac))*(1+flame.pulse)*bloomScale;
    const heat=Math.min(2.0,0.7+0.5*breathFrac+flame.bloom*1.3);
    if(!diving) flashEl.style.opacity=Math.min(1,Math.max(0,(flame.bloom-0.4)/0.55));

    if(hasGL){
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform2f(U.uRes,glc.width,glc.height);
      gl.uniform1f(U.uTime,t); gl.uniform1f(U.uScale,scale);
      gl.uniform1f(U.uAlpha,flame.alpha); gl.uniform1f(U.uHeat,heat);
      gl.uniform1f(U.uBaseY,BASE_Y);
      const growth=(flame.count+breathFrac)/Math.max(1,cfg.target);
      const rb=roleBlend(growth);
      gl.uniform1f(U.uB1,rb.b1); gl.uniform1f(U.uB2,rb.b2);
      gl.uniform3f(U.uCore,rb.core[0],rb.core[1],rb.core[2]);
      gl.uniform3f(U.uSupport,rb.support[0],rb.support[1],rb.support[2]);
      gl.uniform3f(U.uThema,rb.thema[0],rb.thema[1],rb.thema[2]);
      gl.drawArrays(gl.TRIANGLES,0,3);
    }else drawFallback(t,scale,cx,cy);

    drawParticles(dt,t);
    drawWords();
    drawWarpText(t);
  } else {
    drawParticles(dt,t);   // 設定中も闇に粒が舞う
  }
  requestAnimationFrame(frame);
}

let bloomTextTimers=[];
function startBloom(){mode="bloom";flame.bloom=0;buzz([40,60,240]);say("");
  goldRise(W/2,H*(1-BASE_Y));

  const e=document.getElementById("ending");

  mn.innerHTML=esc(msg); sb.textContent="さあ、ゆこう";

  bloomTextTimers.push(setTimeout(()=>{ e.classList.add("on"); mn.style.opacity=1; }, 2400));   // 結びが3秒かけてじんわり
  bloomTextTimers.push(setTimeout(()=>{ sb.style.opacity=1; }, 2400+3000+2000));                // 3秒フェード＋2秒とどまる後、サブが3秒かけて
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");}
function balanceBreak(s){                     // 明示改行は尊重。長い一句は中央付近の区切りで2行に
  if(!s||s.indexOf("\n")>=0||s.length<=16) return s;
  const mid=s.length/2; let best=-1,bd=1e9;
  for(let i=0;i<s.length-1;i++){ if(s[i]==="、"||s[i]==="。"){ const d=Math.abs(i-mid); if(d<bd){bd=d;best=i;} } }
  return best<0 ? s : s.slice(0,best+1)+"\n"+s.slice(best+1);
}

const JP={"朱":"#EB6101","紅":"#C9171E","茜":"#B7282E","緋":"#D3381C","金":"#E6B422","山吹":"#F8B500",
  "橙":"#EE7800","琥珀":"#CA6924","翠":"#00A381","翡翠":"#38B48B","若草":"#AACF53","緑":"#3EB370",
  "藍":"#165E83","群青":"#4A488E","瑠璃":"#1E50A2","鉄紺":"#17184B","青":"#0068B7","浅葱":"#00A3AF",
  "菫":"#7058A3","藤":"#8B81C3","紫":"#884898","牡丹":"#A22041","桜":"#FDEFF2","白":"#F7F7F7","金色":"#E6B422"};
function hexToRgb(h){h=h.replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");
  const n=parseInt(h,16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];}
function resolveColor(str){
  str=(str||"").trim();
  if(/^#?[0-9a-fA-F]{6}$/.test(str)) return (str[0]==="#"?str:"#"+str).toUpperCase();
  if(/^#?[0-9a-fA-F]{3}$/.test(str)){const h=str.replace("#","");return("#"+h.split("").map(c=>c+c).join("")).toUpperCase();}
  if(JP[str]) return JP[str];
  const el=document.createElement("div"); el.style.color=""; el.style.color=str;
  if(el.style.color==="") return null;
  document.body.appendChild(el);const c=getComputedStyle(el).color;document.body.removeChild(el);
  const m=c.match(/(\d+),\s*(\d+),\s*(\d+)/); if(!m) return null;
  const to=x=>(+x).toString(16).padStart(2,"0");
  return ("#"+to(m[1])+to(m[2])+to(m[3])).toUpperCase();
}
function setColor(hex,keepText){
  hex=hex.toUpperCase();
  const rgb=hexToRgb(hex);
  cfg.colors[activeColorRole]={hex,rgb};
  if(activeColorRole==="core"){ cfg.css=hex; cfg.rgb=rgb; }   // 土台＝本編の色として使用（3色シェーダー実装まではこれが主色）
  if(!keepText){ const hf=document.getElementById("hex"); if(hf) hf.value=hex; }
  const prev=document.getElementById("cprev");
  prev.style.background=hex; prev.style.boxShadow="0 0 28px 7px "+hex+"88";
  document.getElementById("cprev-hex").textContent=hex;
}
function hexToHsl(hex){const rgb=hexToRgb(hex),r=rgb[0],g=rgb[1],b=rgb[2];
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    if(mx===r)h=(g-b)/d+(g<b?6:0);else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6;}
  return[Math.round(h*360),Math.round(s*100),Math.round(l*100)];}
function hslToHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,
  a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  const to=x=>Math.round(x*255).toString(16).padStart(2,"0");
  return("#"+to(f(0))+to(f(8))+to(f(4))).toUpperCase();}

/* ---------- 1〜3色（土台／補助／目標）：色数と役割の切り替え ---------- */
let activeColorRole="core";
function roleDefaultHex(role,coreHex){
  const hsl=hexToHsl(coreHex||"#E6863A");
  if(role==="support") return hslToHex((hsl[0]+40)%360,hsl[1],hsl[2]);
  if(role==="thema") return hslToHex((hsl[0]+150)%360,hsl[1],hsl[2]);
  return coreHex||"#E6863A";
}
function ensureColorDefaults(){
  const coreHex=(cfg.colors.core&&cfg.colors.core.hex)||cfg.css||"#E6863A";
  if(!cfg.colors.core) cfg.colors.core={hex:coreHex,rgb:hexToRgb(coreHex)};
  if(cfg.colorCount>=2 && !cfg.colors.thema){ const h=roleDefaultHex("thema",coreHex); cfg.colors.thema={hex:h,rgb:hexToRgb(h)}; }
  if(cfg.colorCount>=3 && !cfg.colors.support){ const h=roleDefaultHex("support",coreHex); cfg.colors.support={hex:h,rgb:hexToRgb(h)}; }
}
/* ---------- 球はひとつ・白熱もひとつ：内側から土台→補助→目標へ、それぞれが独立して感じられる配色比率 ----------
   比率はユーザーが選ぶ（初期値6:1:3）。育つほど土台と目標が入れ替わっていき、育ちきると比率が逆転する。補助の比率は一定。 */
const RING_BAND=0.02;   // 帯の境界のぼかし幅（狭いほど各色がくっきり独立して見える）
const RATIO_SQUEEZE_CORE=0.09/1.9, RATIO_SQUEEZE_SUPPORT=0.01/0.1;   // 広がり切ると土台・補助はほぼ消え、目標がほぼ全てを飲み込む
function roleBlend(growth){
  const g=Math.max(0,Math.min(1,growth));
  const core=(cfg.colors.core&&cfg.colors.core.rgb)||cfg.rgb;
  const cc=cfg.colorCount, r=cfg.ratio;
  if(cc<=1) return {core,support:core,thema:core,b1:1,b2:1};
  if(cc===2){
    const thema=(cfg.colors.thema&&cfg.colors.thema.rgb)||core;
    const sum2=r.core+r.thema;
    const coreShare=r.core+(r.core*RATIO_SQUEEZE_CORE-r.core)*g;      // 育つほど土台がほぼ消え、目標が残りを飲み込む
    const themaShare=sum2-coreShare;
    const b=coreShare/sum2;
    return {core,support:core,thema,b1:b,b2:b};
  }
  const support=(cfg.colors.support&&cfg.colors.support.rgb)||core;
  const thema=(cfg.colors.thema&&cfg.colors.thema.rgb)||core;
  const sum=r.core+r.support+r.thema;
  const coreRaw=r.core+(r.core*RATIO_SQUEEZE_CORE-r.core)*g;
  const supportRaw=r.support+(r.support*RATIO_SQUEEZE_SUPPORT-r.support)*g;
  const coreShare=coreRaw/sum, supportShare=supportRaw/sum;             // 目標は残り全部を吸収して膨らむ
  return {core,support,thema,b1:coreShare,b2:coreShare+supportShare};
}
function currentGrowth(){                                     // 育ち具合（0〜1）：誘導中や結び直後はflame状態がそのまま反映される
  const LCg=cfg.phrases.length||1;
  const breathFrac=(flame.absorbed+flame.lineProg)/LCg;
  return Math.max(0,Math.min(1,(flame.count+breathFrac)/Math.max(1,cfg.target)));
}
function effectiveRGB(){                                      // 誘導の光・開花・帰り道など、単色前提の演出用に「今の混ざり具合」を1色に集約
  const rb=roleBlend(currentGrowth());
  const wCore=rb.b1, wSupport=Math.max(0,rb.b2-rb.b1), wThema=Math.max(0,1-rb.b2), sum=wCore+wSupport+wThema||1;
  return [0,1,2].map(i=>(rb.core[i]*wCore+rb.support[i]*wSupport+rb.thema[i]*wThema)/sum);
}
function effectiveHex(){
  const c=effectiveRGB(), to=x=>Math.round(Math.max(0,Math.min(1,x))*255).toString(16).padStart(2,"0");
  return "#"+to(c[0])+to(c[1])+to(c[2]);
}
function rgbToHex(rgb){const to=x=>Math.round(Math.max(0,Math.min(1,x))*255).toString(16).padStart(2,"0");
  return "#"+to(rgb[0])+to(rgb[1])+to(rgb[2]);}
function layeredStops(growth,maxOffsetR,coreInnerOffset){        // 土台→補助→目標を"層"として持つグラデーション用の色停止点（2Dキャンバス用）
  coreInnerOffset=coreInnerOffset||0;
  const rb=roleBlend(growth);
  const b1raw=Math.min(0.99,rb.b1/maxOffsetR), b2raw=Math.min(0.995,rb.b2/maxOffsetR);
  // 白い芯のゾーンはb1に対して比例的に確保する（b1が縮んでも白だけが不自然に広く残らないように）
  const innerOff=Math.min(coreInnerOffset,b1raw*0.6);
  const b1=Math.max(innerOff+0.01,b1raw), b2=Math.max(b1+0.01,b2raw);
  const band=Math.min(RING_BAND/maxOffsetR,(b2-b1)/2,(b1-innerOff)/2);
  return [
    [innerOff,rgbToHex(rb.core)],
    [Math.max(innerOff,b1-band),rgbToHex(rb.core)],
    [b1+band,rgbToHex(rb.support)],
    [b2-band,rgbToHex(rb.support)],
    [Math.min(1,b2+band),rgbToHex(rb.thema)],
  ];
}

const sH=document.getElementById("sH"),sS=document.getElementById("sS"),sL=document.getElementById("sL");
function paintTracks(){const h=+sH.value;
  sH.style.background="linear-gradient(90deg,hsl(0,80%,55%),hsl(60,80%,55%),hsl(120,80%,55%),hsl(180,80%,55%),hsl(240,80%,55%),hsl(300,80%,55%),hsl(360,80%,55%))";
  sS.style.background="linear-gradient(90deg,hsl("+h+",8%,55%),hsl("+h+",95%,52%))";
  sL.style.background="linear-gradient(90deg,#0a0c18,hsl("+h+",80%,55%),#eef3ff)";}
function fromSliders(){setColor(hslToHex(+sH.value,+sS.value,+sL.value));markSwatch(null);paintTracks();}
[sH,sS,sL].forEach(s=>s.addEventListener("input",fromSliders));
function syncSliders(hex){const hsl=hexToHsl(hex);
  sH.value=hsl[0];sS.value=Math.max(20,Math.min(100,hsl[1]));sL.value=Math.max(25,Math.min(75,hsl[2]));paintTracks();}

/* ---------- 保存（レシピのみ／記録はしない）。実アプリでは永続、プレビューでは揮発 ---------- */
const SKEY="ember_prayers_v1";
let store=[];
function loadStore(){ try{const s=localStorage.getItem(SKEY);store=s?JSON.parse(s):[];}catch(e){store=[];}
  if(!Array.isArray(store))store=[]; }
function persist(){ try{localStorage.setItem(SKEY,JSON.stringify(store));}catch(e){} }
function firstLine(t){ if(!t)return""; const l=t.split(/\n/).map(s=>s.trim()).filter(Boolean);
  const s=l[0]||""; return s.length>18?s.slice(0,18):s; }
function splitPhrases(raw){ return raw?raw.split(/[、。\n\r,.!?！？　]+/).map(s=>s.trim()).filter(Boolean):[]; }

/* ---------- ホーム（保存した祈り一覧） ---------- */
let editingIndex=-1;
function renderHome(){
  const list=document.getElementById("prayer-list"); list.innerHTML="";
  if(!store.length){ const d=document.createElement("div"); d.className="empty-note";
    d.textContent="まだ祈りはありません"; list.appendChild(d); return; }
  store.forEach((p,i)=>{
    const row=document.createElement("div"); row.className="prayer";
    const dot=document.createElement("span"); dot.className="pd";
    dot.style.background=p.hex; dot.style.boxShadow="0 0 12px 2px "+p.hex+"aa";
    const nm=document.createElement("span"); nm.className="pn"; nm.textContent=p.name||"無題";
    const edit=document.createElement("button"); edit.className="px"; edit.textContent="✎";
    const del=document.createElement("button"); del.className="px"; del.textContent="×";
    row.appendChild(dot); row.appendChild(nm); row.appendChild(edit); row.appendChild(del);
    row.addEventListener("click",()=>lightPrayer(p));
    edit.addEventListener("click",e=>{e.stopPropagation();editPrayer(p,i);});
    del.addEventListener("click",e=>{e.stopPropagation();store.splice(i,1);persist();renderHome();
      if(!store.length)showStep("color");});
    list.appendChild(row);
  });
}
function editPrayer(p,i){
  editingIndex=i;
  cfg.colorCount=p.colorCount||1;
  cfg.colors=p.colors?{core:p.colors.core||null,support:p.colors.support||null,thema:p.colors.thema||null}
                     :{core:{hex:p.hex,rgb:hexToRgb(p.hex)},support:null,thema:null};
  cfg.ratio=p.ratio||{core:1.9,support:0.1,thema:8.0};
  document.querySelector('#ccount-seg button[data-n="'+cfg.colorCount+'"]').click();
  cfg.words=p.words||""; cfg.phrases=splitPhrases(cfg.words);
  cfg.closing=p.closing||""; cfg.target=p.count||3; cfg.system=p.system||null;
  cfg.inductLines=p.inductLines&&p.inductLines.length?p.inductLines.map(l=>({...l})):null;
  document.getElementById("mantra").value=cfg.words;
  document.getElementById("closing").value=cfg.closing;
  target=cfg.target; document.getElementById("count-n").textContent=target;
  saveNameEl.value=p.name||""; saveNameEl.classList.add("on"); saveOn=true; saveToggle.classList.add("on");
  document.getElementById("il-toggle").checked=!!cfg.inductLines;
  document.getElementById("il-editor").classList.toggle("on",!!cfg.inductLines);
  if(cfg.inductLines){ ilLines=cfg.inductLines.map(l=>({...l})); ilRender(); }
  showStep("color");
}
function lightPrayer(p){
  cfg.colorCount=p.colorCount||1;
  cfg.colors=p.colors?{core:p.colors.core||null,support:p.colors.support||null,thema:p.colors.thema||null}
                     :{core:{hex:p.hex,rgb:hexToRgb(p.hex)},support:null,thema:null};   // 旧・単色データはCore一色として復元
  cfg.ratio=p.ratio||{core:6,support:1,thema:3};
  document.querySelector('#ccount-seg button[data-n="'+cfg.colorCount+'"]').click();   // 色数UI・役割タブ・比率・プレビューを一括で同期
  cfg.words=p.words||""; cfg.phrases=splitPhrases(cfg.words);
  cfg.closing=p.closing||""; cfg.target=p.count||3; cfg.system=p.system||null;
  cfg.inductLines=p.inductLines&&p.inductLines.length?p.inductLines.map(l=>({...l})):null;
  startInduction();
}
document.getElementById("new-prayer").addEventListener("click",()=>{

function buildChips(wrapId,field,targetId){
  const wrap=document.getElementById(wrapId), idx={};
  SYSTEMS.forEach(sys=>{ idx[sys.key]=0;
    const b=document.createElement("button"); b.textContent=sys.key;
    b.addEventListener("click",()=>{ const arr=sys[field];
      document.getElementById(targetId).value=arr[idx[sys.key]%arr.length]; idx[sys.key]++;
      cfg.system=sys.key; });                       // 系統を記録（誘導の味付けに使う）
    wrap.appendChild(b);
  });
}

/* ---------- 誘導文のカスタム編集 ---------- */
let ilLines=null;   // null=デフォルトのまま。配列=カスタム編集中
function ilDefaultLines(){
  return buildInductLines().map(l=>({t:l.t, dur:(typeof l.dur==="number")?l.dur:(l.count?3:FADE*2), count:!!l.count}));
}
function ilRender(){
  const wrap=document.getElementById("il-list");
  wrap.innerHTML="";
  ilLines.forEach((ln,i)=>{
    const card=document.createElement("div"); card.className="il-card";
    card.innerHTML=
      '<textarea rows="2" data-i="'+i+'" class="il-text">'+esc(ln.t)+'</textarea>'+
      '<div class="il-row2">'+
        '<label>時間<input type="number" min="1" max="60" step="0.5" class="il-dur" data-i="'+i+'" value="'+ln.dur+'">秒</label>'+
        '<label><input type="checkbox" class="il-count" data-i="'+i+'" '+(ln.count?"checked":"")+'>カウント表示</label>'+
        '<div class="il-btns">'+
          '<button class="il-up" data-i="'+i+'">↑</button>'+
          '<button class="il-down" data-i="'+i+'">↓</button>'+
          '<button class="il-del" data-i="'+i+'">×</button>'+
        '</div>'+
      '</div>';
    wrap.appendChild(card);
  });
  wrap.querySelectorAll(".il-text").forEach(el=>el.addEventListener("input",e=>{ ilLines[+e.target.dataset.i].t=e.target.value; }));
  wrap.querySelectorAll(".il-dur").forEach(el=>el.addEventListener("input",e=>{ ilLines[+e.target.dataset.i].dur=Math.max(1,+e.target.value||1); }));
  wrap.querySelectorAll(".il-count").forEach(el=>el.addEventListener("change",e=>{ ilLines[+e.target.dataset.i].count=e.target.checked; }));
  wrap.querySelectorAll(".il-del").forEach(el=>el.addEventListener("click",e=>{ ilLines.splice(+e.target.dataset.i,1); ilRender(); }));
  wrap.querySelectorAll(".il-up").forEach(el=>el.addEventListener("click",e=>{ const i=+e.target.dataset.i; if(i>0){ [ilLines[i-1],ilLines[i]]=[ilLines[i],ilLines[i-1]]; ilRender(); } }));
  wrap.querySelectorAll(".il-down").forEach(el=>el.addEventListener("click",e=>{ const i=+e.target.dataset.i; if(i<ilLines.length-1){ [ilLines[i+1],ilLines[i]]=[ilLines[i],ilLines[i+1]]; ilRender(); } }));
}
document.getElementById("il-toggle").addEventListener("change",e=>{
  document.getElementById("il-editor").classList.toggle("on",e.target.checked);
  if(e.target.checked){
    ilLines=(cfg.inductLines&&cfg.inductLines.length)?cfg.inductLines.map(l=>({...l})):ilDefaultLines();
    ilRender();
  }else{
    cfg.inductLines=null; ilLines=null;
  }
});
document.getElementById("il-add").addEventListener("click",()=>{
  ilLines.push({t:"あたらしい一文",dur:FADE*2,count:false}); ilRender();
});
document.getElementById("il-reset").addEventListener("click",()=>{
  ilLines=ilDefaultLines(); ilRender();
});

/* ---------- 保存トグル＋手動命名 ---------- */
let saveOn=false;
const saveToggle=document.getElementById("save-toggle"), saveNameEl=document.getElementById("save-name");
function prefillName(){ if(!saveNameEl.value.trim()) saveNameEl.value=firstLine(document.getElementById("mantra").value)||""; }
saveToggle.addEventListener("click",()=>{ saveOn=!saveOn;
  saveToggle.classList.toggle("on",saveOn);
  document.getElementById("save-box").textContent=saveOn?"✓":"";
  saveNameEl.classList.toggle("on",saveOn);
  if(saveOn) prefillName();
});
function savePrayer(){
  const name=(saveNameEl.value.trim())||firstLine(cfg.words)||"無題";
  const entry={name,hex:cfg.css,colors:cfg.colors,colorCount:cfg.colorCount,ratio:cfg.ratio,
    words:cfg.words||"",closing:cfg.closing||"",count:cfg.target,system:cfg.system||null,
    inductLines:cfg.inductLines?cfg.inductLines.map(l=>({...l})):null};
  if(editingIndex>=0&&editingIndex<store.length){ store[editingIndex]=entry; editingIndex=-1; }  // 編集中なら上書き
  else{ store.push(entry); if(store.length>10) store.splice(0,store.length-10); }                // 10を超えたら古いものから消える
  persist();
}

  {q:"自分のためだけなら、自分とは何者か。", s:"― ユダヤの教えより", src:"ヒレルの言葉", note:"自分と他者、両方への責任を問う一句。"},
  {q:"沈黙は、知恵を守る垣根になる。", s:"― ユダヤの教えより", src:"『ピルケイ・アヴォット（父祖の教え）』", note:"語りすぎないことの価値。"},
  {q:"平和を、追い求める人であれ。", s:"― ユダヤの教えより", src:"『父祖の教え』", note:"平和を愛し、平和を追う者であれ、の趣旨。"},
  {q:"手を開く者のもとに、恵みは巡る。", s:"― ユダヤの教えより", src:"「ツェダカ（施し・正義）」", note:"施しは慈善であり、同時に正義とされる。"},
  {q:"自分がされたくないことは、人にもしない。", s:"― 儒の教えより", src:"『論語』", note:"孔子の説いた「恕」の核心。"},
  {q:"あやまちを改めないこと。それこそが、ほんとうのあやまち。", s:"― 孔子の言葉より", src:"『論語』衛霊公", note:"過ちて改めざる、是を過ちという。"},
  {q:"学んで考え、考えて学ぶ。どちらも欠かせない。", s:"― 孔子の言葉より", src:"『論語』為政", note:"学びと思索は両輪、という教え。"},
  {q:"知っていることを知り、知らないことを知らないとする。それが、知だ。", s:"― 孔子の言葉より", src:"『論語』為政", note:"知の誠実さについての一句。"},
  {q:"三人いれば、そこに必ず、自分の師がいる。", s:"― 孔子の言葉より", src:"『論語』述而", note:"誰からも学べる、という謙虚さ。"},
  {q:"遠い先を思わなければ、近くに憂いが生まれる。", s:"― 孔子の言葉より", src:"『論語』衛霊公", note:"遠慮なければ近憂あり。"},
  {q:"水はやわらかいのに、かたい岩をも、いつか削る。", s:"― 老子の言葉より", src:"『老子（道徳経）』", note:"上善は水の如し、柔よく剛を制す。"},
  {q:"何もしていないように見えて、すべては静かに巡っている。", s:"― 道家の考えより", src:"『老子』「無為」", note:"作為せずして成る、という思想。"},
  {q:"足るを知る人は、いつも豊かだ。", s:"― 老子の言葉より", src:"『老子』", note:"足るを知る者は富む。"},
  {q:"千里の道も、足もとの一歩から始まる。", s:"― 老子の言葉より", src:"『老子』", note:"千里の行も足下より始まる。"},
  {q:"うまくいっているときほど、静かに退く。", s:"― 老子の言葉より", src:"『老子』", note:"功成り名遂げて身退くは、天の道。"},
  {q:"しなやかなものは、折れずに残る。", s:"― 荘子の考えより", src:"『荘子』", note:"役立たずに見えるものが、天寿を全うする、の趣旨。"},
  {q:"結果は手放して、いま為すべきことに、ただ向かう。", s:"― インドの教えより", src:"『バガヴァッド・ギーター』", note:"行為の結果に執着するな、という教え。"},
  {q:"呼吸を整えると、心もおのずと静まっていく。", s:"― ヨーガの教えより", src:"『ヨーガ・スートラ』", note:"プラーナーヤーマ（調気）の考え。"},
  {q:"心の波が静まったとき、ほんとうの自分が見える。", s:"― ヨーガの教えより", src:"『ヨーガ・スートラ』冒頭", note:"ヨーガとは心の作用を止滅すること。"},
  {q:"あなたのなかにも、大いなるものが宿っている。", s:"― インドの教えより", src:"ウパニシャッド「梵我一如」", note:"個の魂と宇宙は本来ひとつ、という思想。"},
  {q:"いま在ることに、ただ気づいている。", s:"― ヨーガの教えより", src:"ヨーガの「サークシー（目撃者）」", note:"判断せず、ただ観る意識。"},
  {q:"執着も、憎しみも手放したところに、平安がある。", s:"― インドの教えより", src:"『バガヴァッド・ギーター』", note:"心の平静（サマトヴァ）を説く。"},
  {q:"まず、けがれを祓い、心を清らかに。", s:"― 神道の心より", src:"神道の「祓（はらえ）」", note:"罪や穢れを祓い清める、神道の基本。"},
  {q:"米一粒にも、八百万の神が宿る。", s:"― 神道の心より", src:"「八百万の神」", note:"あらゆるものに神性を見る、日本の感性。"},
  {q:"自然に逆らわず、めぐる季節とともに生きる。", s:"― 神道の心より", src:"惟神（かんながら）の道", note:"自然の理にしたがう生き方。"},

  {q:"出来事そのものより、それをどう見るかが、心を決める。", s:"― ストア派の考えより", src:"エピクテトス『提要』", note:"人を乱すのは出来事でなく、それへの見方。"},
  {q:"今日が最後の一日でも悔いないように、生きてみる。", s:"― ストア派の考えより", src:"ストア派「メメント・モリ」", note:"死を思うことで、いまを大切にする。"},
  {q:"起きたことは、起きたこと。次に、どうするかだ。", s:"― ストア派の考えより", src:"マルクス・アウレリウス『自省録』", note:"過去に囚われず、次の一手に向かう。"},
  {q:"他人の評価ではなく、自分の行いを見つめる。", s:"― ストア派の考えより", src:"『自省録』", note:"外の声より、内なる正しさを基準に。"},
  {q:"朝、目覚めたら、生きていることをひとつの恵みと思う。", s:"― ストア派の考えより", src:"マルクス・アウレリウス『自省録』", note:"一日の始まりへの感謝。"},
  {q:"怒りは、たいてい自分を苦しめるだけで終わる。", s:"― ストア派の考えより", src:"セネカ『怒りについて』", note:"怒りの無益さを説く。"},
  {q:"持たないことを嘆くより、あるものに目を向ける。", s:"― ストア派の考えより", src:"セネカの書簡", note:"欠乏でなく、充足に心を向ける。"},
  {q:"自分が何も知らないと気づくこと。そこから、知が始まる。", s:"― ソクラテスの言葉より", src:"プラトン『ソクラテスの弁明』", note:"「無知の知」。"},
  {q:"多すぎず、少なすぎず。ちょうどよさのなかに、しあわせがある。", s:"― ギリシアの哲学より", src:"アリストテレス『ニコマコス倫理学』", note:"「中庸（メソテース）」。"},
  {q:"吟味されない人生は、生きるに値しない。", s:"― ソクラテスの言葉より", src:"プラトン『ソクラテスの弁明』", note:"省みることの大切さ。"},
  {q:"幸福は、良く生きることそのものにある。", s:"― ギリシアの哲学より", src:"アリストテレス「エウダイモニア」", note:"快楽でなく、善き活動に幸福を見る。"},
  {q:"まず、汝自身を知れ。", s:"― ギリシアの言葉より", src:"デルポイの神殿の格言", note:"古代ギリシアに刻まれた、自己認識の勧め。"},
  {q:"この一日を、大切に生きる。", s:"― ギリシア・ローマの言葉より", src:"ホラティウス「カルペ・ディエム」", note:"今日という日を、味わい摘め。"},
  {q:"千里の道も、一歩から。", s:"― 世界の諺より", src:"由来には諸説あり（東洋の格言）", note:"大きな事も、小さな一歩から。"},
  {q:"急がば、まわれ。", s:"― 世界の諺より", src:"日本の諺", note:"危うい近道より、安全な回り道を。"},
  {q:"転んでも、また起き上がればいい。何度でも。", s:"― 世界の諺より", src:"「七転び八起き」", note:"何度倒れても立ち上がる粘り。"},
  {q:"木を植えるのに一番いい時は、二十年前。次にいいのは、今日。", s:"― 世界の諺より", src:"由来には諸説あり", note:"遅すぎることはない、今日から始めよ。"},
  {q:"一日一日が、小さな一生だと思って生きる。", s:"― 世界の諺より", src:"由来には諸説あり", note:"一日を大切にする心構え。"},
  {q:"静かな水こそ、深く流れている。", s:"― 世界の諺より", src:"西洋の諺", note:"物静かな人ほど、内に深いものを持つ。"},
  {q:"明けない夜は、ない。", s:"― 世界の諺より", src:"世界各地に伝わる言葉", note:"どんな困難にも、終わりが来る。"},
  {q:"遠くへ行きたいなら、みんなで行け。", s:"― 世界の諺より", src:"アフリカに伝わる諺", note:"早く行くなら一人、遠くへ行くなら共に。"},
  {q:"小さな斧でも、打ち続ければ大木を倒す。", s:"― 世界の諺より", src:"世界各地の格言", note:"継続の力。"},
  {q:"昨日はもう戻らない。明日はまだ来ない。あるのは、今日だけ。", s:"― 世界の諺より", src:"由来には諸説あり", note:"今日を生きることの大切さ。"},
  {q:"感謝は、心のいちばん美しい記憶。", s:"― 世界の諺より", src:"西洋に伝わる言葉", note:"感謝を忘れない心。"},
  {q:"大切なのは、問い続けることを、やめないこと。", s:"― ある物理学者の言葉より", src:"アインシュタインに帰される言葉", note:"好奇心を持ち続けることの大切さ（逐語ではなく趣旨）。"},
  {q:"想像力は、知識よりも遠くへ、あなたを連れていく。", s:"― ある物理学者の言葉より", src:"アインシュタインに帰される言葉", note:"想像力の価値を語った言葉の趣旨。"},
  {q:"恐れるのではなく、理解する。理解が、恐れを解く。", s:"― ある科学者の言葉より", src:"マリ・キュリーに帰される言葉", note:"未知を恐れず、理解しようとする姿勢。"},
  {q:"私たちは、星のかけらでできている。", s:"― ある天文学者の言葉より", src:"カール・セーガンに帰される言葉", note:"人も宇宙の一部だ、という視点。"},
  {q:"巨人の肩に乗れば、より遠くが見える。", s:"― ある科学者の言葉より", src:"ニュートンに帰される言葉", note:"先人の積み重ねの上に立つ、という謙虚さ。"},
  {q:"昨日から学び、今日を生き、明日を望む。", s:"― ある思索家の言葉より", src:"出典には諸説あり", note:"時間との向き合い方。"},
  {q:"幸せは香水のよう。人にふりかければ、自分にもかかる。", s:"― ある思索家の言葉より", src:"出典には諸説あり", note:"与えた幸福が、自分に返るという趣旨。"}
];
function drawGateOrb(t){
  const cx=W/2, cy=H*(1-BASE_Y), col="#bcd4ff";
  const bp=Math.sin(t*2*Math.PI/6.5);
  const R=Math.min(W,H)*0.1*(1+0.12*bp);
  fx.save();
  let g=fx.createRadialGradient(cx,cy,0,cx,cy,R*1.9);
  g.addColorStop(0,col); g.addColorStop(0.5,col+"44"); g.addColorStop(1,col+"00");
  fx.globalAlpha=0.55; fx.fillStyle=g; fx.beginPath();fx.arc(cx,cy,R*1.9,0,6.283);fx.fill();
  fx.globalAlpha=1;
  g=fx.createRadialGradient(cx,cy,0,cx,cy,R);
  g.addColorStop(0,"rgba(255,255,255,0.97)"); g.addColorStop(0.42,col); g.addColorStop(1,col+"00");
  fx.fillStyle=g; fx.beginPath();fx.arc(cx,cy,R,0,6.283);fx.fill();
  fx.restore();
}
const gQ=document.getElementById("gate-quote"), gS=document.getElementById("gate-src"), gGo=document.getElementById("gate-go");
function initGate(){
  const pick=QUOTES[Math.floor(Math.random()*QUOTES.length)];
  gQ.innerHTML=esc(balanceBreak(pick.q)); gS.textContent=pick.s;
  document.body.classList.remove("dark");
  nightfallEl.style.opacity=1;                       // 闇の入り口
  document.getElementById("veil").classList.add("hide");
  gateEl.classList.add("on"); mode="gate";
  setTimeout(()=>{ gQ.style.opacity=1; gS.style.opacity=1; gGo.style.opacity=1; }, 400);
}
let gateGone=false;
function gateGo(){
  if(gateGone||mode!=="gate")return; gateGone=true;
  [gQ,gS,gGo].forEach(el=>{ el.style.transition="opacity .6s ease"; el.style.opacity=0; });
  const veil=document.getElementById("veil");
  renderHome(); showStep(store.length?"home":"color");
  veil.style.transition="opacity 3s ease";           // 夜明け：白のホームが3秒かけて明ける
  requestAnimationFrame(()=>veil.classList.remove("hide"));
  setTimeout(()=>{
    if(mode==="gate") mode="setup";   // ユーザーが既に祈りを選んで先へ進んでいたら、上書きしない
    gateEl.classList.remove("on"); nightfallEl.style.opacity=0;
    veil.style.transition="opacity .8s ease";
  }, 3000);
}
gateEl.addEventListener("pointerdown",gateGo);

/* ---------- 初期化 ---------- */
setColor("#E6863A"); syncSliders("#E6863A");
loadStore(); initGate();
resize(); initParticles(); window.addEventListener("resize",resize);
requestAnimationFrame(frame);
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("service-worker.js").catch(()=>{}); });
}
